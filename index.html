<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ONE WRONG TAP</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(
            circle at center,
            #222 0%,
            #111 45%,
            #050505 100%
        );
    color: white;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 100%;
    height: 100%;
    max-width: 900px;
    position: relative;
    overflow: hidden;
}

/* =====================================================
   SCREENS
===================================================== */

.screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.screen.active {
    display: flex;
}

/* =====================================================
   START SCREEN
===================================================== */

.logo {
    text-align: center;
    margin-bottom: 20px;
}

.logo .one {
    font-size: clamp(48px, 13vw, 90px);
    font-weight: 900;
    letter-spacing: 5px;
    line-height: 0.9;
}

.logo .wrong {
    font-size: clamp(32px, 9vw, 65px);
    font-weight: 900;
    letter-spacing: 3px;
    color: #fcc224;
    line-height: 1;
}

.logo .tap {
    font-size: clamp(32px, 9vw, 65px);
    font-weight: 900;
    letter-spacing: 3px;
    line-height: 1;
}

.tagline {
    margin-top: 15px;
    font-size: 16px;
    color: #aaa;
    text-align: center;
}

.best-start {
    margin-top: 25px;
    font-size: 15px;
    color: #888;
}

.best-start span {
    color: #fcc224;
    font-weight: bold;
}

.start-button,
.play-again-button {
    margin-top: 30px;
    border: none;
    background: #fcc224;
    color: #000;
    font-size: 18px;
    font-weight: 900;
    padding: 16px 42px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(252,194,36,0.25);
    touch-action: manipulation;
}

.start-button:active,
.play-again-button:active {
    transform: scale(0.96);
}

/* =====================================================
   HUD
===================================================== */

.hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 72px;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    background: rgba(0,0,0,0.35);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    z-index: 10;
}

.hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.hud-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #777;
    margin-bottom: 4px;
}

.hud-value {
    font-size: 22px;
    font-weight: 900;
}

#timeValue {
    color: #fcc224;
}

#streakValue {
    color: #fcc224;
}

/* =====================================================
   PLAY AREA
===================================================== */

.play-area {
    position: absolute;
    top: 72px;
    left: 0;
    right: 0;
    bottom: 0;

    overflow: hidden;

    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

/* =====================================================
   TARGET
===================================================== */

.target {
    position: absolute;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;
    font-weight: 900;
    letter-spacing: 1px;

    background: white;
    color: #000;

    box-shadow:
        0 0 0 2px rgba(255,255,255,0.15),
        0 8px 25px rgba(0,0,0,0.35);

    touch-action: none;
    user-select: none;
    -webkit-user-select: none;

    animation: targetAppear 0.18s ease-out;
}

.target.correct {
    background: #fcc224;
    box-shadow:
        0 0 0 3px rgba(252,194,36,0.2),
        0 0 30px rgba(252,194,36,0.28),
        0 8px 25px rgba(0,0,0,0.35);
}

.target:active {
    transform: scale(0.94);
}

@keyframes targetAppear {

    from {
        opacity: 0;
        transform: scale(0.75);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

/* =====================================================
   STREAK MESSAGE
===================================================== */

.streak-message {
    position: absolute;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    font-size: clamp(30px, 8vw, 60px);
    font-weight: 900;
    color: #fcc224;

    pointer-events: none;
    z-index: 20;

    opacity: 0;
}

.streak-message.show {
    animation: streakPop 0.8s ease-out;
}

@keyframes streakPop {

    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.6);
    }

    20% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.15);
    }

    70% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.05);
    }

}

/* =====================================================
   COUNTDOWN
===================================================== */

.countdown-number {
    font-size: clamp(80px, 25vw, 180px);
    font-weight: 900;
    color: #fcc224;

    text-shadow:
        0 0 35px rgba(252,194,36,0.25);

    animation: countdownPop 0.8s ease-out;
}

@keyframes countdownPop {

    0% {
        opacity: 0;
        transform: scale(0.5);
    }

    35% {
        opacity: 1;
        transform: scale(1.1);
    }

    100% {
        opacity: 0;
        transform: scale(1.25);
    }

}

/* =====================================================
   GAME OVER
===================================================== */

.game-over-title {
    font-size: clamp(42px, 12vw, 75px);
    font-weight: 900;
    letter-spacing: 2px;
}

.final-label {
    margin-top: 25px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #777;
}

.final-score {
    margin-top: 5px;
    font-size: clamp(65px, 18vw, 120px);
    font-weight: 900;
    color: #fcc224;
    line-height: 1;
}

.new-best {
    margin-top: 10px;
    font-size: 16px;
    font-weight: 900;
    color: #fcc224;
    opacity: 0;
}

.new-best.show {
    opacity: 1;
}

.best-final {
    margin-top: 18px;
    color: #888;
    font-size: 14px;
}

.best-final span {
    color: white;
    font-weight: bold;
}

/* =====================================================
   WRONG TAP FLASH
===================================================== */

.wrong-flash {
    position: absolute;
    inset: 0;

    background: rgba(255,0,0,0.35);

    pointer-events: none;

    opacity: 0;
    z-index: 50;
}

.wrong-flash.show {
    animation: wrongFlash 0.35s ease-out;
}

@keyframes wrongFlash {

    0% {
        opacity: 0;
    }

    25% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }

}

/* =====================================================
   SMALL PHONES
===================================================== */

@media (max-width: 380px) {

    .hud {
        height: 65px;
    }

    .play-area {
        top: 65px;
    }

    .hud-value {
        font-size: 19px;
    }

}

/* =====================================================
   LANDSCAPE
===================================================== */

@media (orientation: landscape) and (max-height: 500px) {

    .hud {
        height: 60px;
    }

    .play-area {
        top: 60px;
    }

    .target {
        width: 80px;
        height: 80px;
    }

}

/* =====================================================
   DISABLE CONTEXT MENU
===================================================== */

body {
    -webkit-touch-callout: none;
}

</style>
</head>

<body>

<div class="game">

    <!-- =================================================
         START SCREEN
    ================================================== -->

    <div id="startScreen" class="screen active">

        <div class="logo">

            <div class="one">
                ONE
            </div>

            <div class="wrong">
                WRONG
            </div>

            <div class="tap">
                TAP
            </div>

        </div>

        <div class="tagline">
            One wrong tap and it's over.
        </div>

        <div class="best-start">
            BEST:
            <span id="startBest">0</span>
        </div>

        <button
            id="startButton"
            class="start-button"
            type="button"
        >
            START GAME
        </button>

    </div>


    <!-- =================================================
         GAME SCREEN
    ================================================== -->

    <div id="gameScreen" class="screen">

        <div class="hud">

            <div class="hud-item">

                <div class="hud-label">
                    TIME
                </div>

                <div
                    id="timeValue"
                    class="hud-value"
                >
                    30
                </div>

            </div>


            <div class="hud-item">

                <div class="hud-label">
                    SCORE
                </div>

                <div
                    id="scoreValue"
                    class="hud-value"
                >
                    0
                </div>

            </div>


            <div class="hud-item">

                <div class="hud-label">
                    BEST
                </div>

                <div
                    id="bestValue"
                    class="hud-value"
                >
                    0
                </div>

            </div>


            <div class="hud-item">

                <div class="hud-label">
                    STREAK
                </div>

                <div
                    id="streakValue"
                    class="hud-value"
                >
                    0
                </div>

            </div>

        </div>


        <div
            id="playArea"
            class="play-area"
        ></div>


        <div
            id="streakMessage"
            class="streak-message"
        ></div>

    </div>


    <!-- =================================================
         COUNTDOWN SCREEN
    ================================================== -->

    <div
        id="countdownScreen"
        class="screen"
    >

        <div
            id="countdownNumber"
            class="countdown-number"
        >
            3
        </div>

    </div>


    <!-- =================================================
         GAME OVER SCREEN
    ================================================== -->

    <div
        id="gameOverScreen"
        class="screen"
    >

        <div class="game-over-title">
            GAME OVER
        </div>

        <div class="final-label">
            FINAL SCORE
        </div>

        <div
            id="finalScore"
            class="final-score"
        >
            0
        </div>

        <div
            id="newBest"
            class="new-best"
        >
            NEW BEST!
        </div>

        <div class="best-final">
            BEST:
            <span id="finalBest">0</span>
        </div>

        <button
            id="playAgainButton"
            class="play-again-button"
            type="button"
        >
            PLAY AGAIN
        </button>

    </div>


    <!-- =================================================
         WRONG FLASH
    ================================================== -->

    <div
        id="wrongFlash"
        class="wrong-flash"
    ></div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const startScreen =
    document.getElementById("startScreen");

const gameScreen =
    document.getElementById("gameScreen");

const countdownScreen =
    document.getElementById("countdownScreen");

const gameOverScreen =
    document.getElementById("gameOverScreen");

const startButton =
    document.getElementById("startButton");

const playAgainButton =
    document.getElementById("playAgainButton");

const playArea =
    document.getElementById("playArea");

const timeValue =
    document.getElementById("timeValue");

const scoreValue =
    document.getElementById("scoreValue");

const bestValue =
    document.getElementById("bestValue");

const streakValue =
    document.getElementById("streakValue");

const startBest =
    document.getElementById("startBest");

const finalScore =
    document.getElementById("finalScore");

const finalBest =
    document.getElementById("finalBest");

const newBest =
    document.getElementById("newBest");

const countdownNumber =
    document.getElementById("countdownNumber");

const streakMessage =
    document.getElementById("streakMessage");

const wrongFlash =
    document.getElementById("wrongFlash");


/* =====================================================
   GAME STATE
===================================================== */

let score = 0;

let streak = 0;

let timeLeft = 30;

let gameRunning = false;

let countdownRunning = false;

let timer = null;

let countdownTimer = null;

let round = 0;


/* =====================================================
   HIGH SCORE
===================================================== */

const HIGH_SCORE_KEY =
    "oneWrongTapHighScore";


function getHighScore() {

    return Number(
        localStorage.getItem(HIGH_SCORE_KEY) || 0
    );

}


function saveHighScore(value) {

    localStorage.setItem(
        HIGH_SCORE_KEY,
        String(value)
    );

}


function updateBestDisplays() {

    const best = getHighScore();

    startBest.textContent = best;

    bestValue.textContent = best;

    finalBest.textContent = best;

}


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;


function initializeAudio() {

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (AudioContext) {

            audioContext =
                new AudioContext();

        }

    }

    if (
        audioContext &&
        audioContext.state === "suspended"
    ) {

        audioContext.resume();

    }

}


function playTone(
    frequency,
    duration,
    volume,
    type = "sine",
    delay = 0
) {

    if (!audioContext) {
        return;
    }

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        0,
        audioContext.currentTime + delay
    );

    gain.gain.linearRampToValueAtTime(
        volume,
        audioContext.currentTime + delay + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime +
        delay +
        duration
    );

    oscillator.connect(gain);

    gain.connect(audioContext.destination);

    oscillator.start(
        audioContext.currentTime + delay
    );

    oscillator.stop(
        audioContext.currentTime +
        delay +
        duration +
        0.02
    );

}


function playCorrectSound() {

    playTone(
        700,
        0.08,
        0.045,
        "sine"
    );

}


function playStreakSound() {

    playTone(
        700,
        0.10,
        0.04,
        "sine",
        0
    );

    playTone(
        900,
        0.10,
        0.04,
        "sine",
        0.08
    );

    playTone(
        1200,
        0.14,
        0.05,
        "sine",
        0.16
    );

}


function playWrongSound() {

    playTone(
        120,
        0.20,
        0.06,
        "sawtooth"
    );

}


function playFinalSecondsSound() {

    playTone(
        500,
        0.05,
        0.025,
        "sine"
    );

}


function playCountdownSound(number) {

    if (number === 0) {

        playTone(
            1000,
            0.15,
            0.05,
            "sine"
        );

    } else {

        playTone(
            500,
            0.10,
            0.04,
            "sine"
        );

    }

}


/* =====================================================
   HAPTICS
===================================================== */

function vibrate(pattern) {

    if (
        "vibrate" in navigator
    ) {

        navigator.vibrate(pattern);

    }

}


function vibrateCorrect() {

    vibrate(8);

}


function vibrateStreak() {

    vibrate([18, 25, 18]);

}


function vibrateWrong() {

    vibrate([70, 35, 100]);

}


function vibrateCountdown() {

    vibrate(12);

}


function vibrateGo() {

    vibrate([25, 20, 35]);

}


/* =====================================================
   SCREEN MANAGEMENT
===================================================== */

function showScreen(screen) {

    startScreen.classList.remove("active");

    gameScreen.classList.remove("active");

    countdownScreen.classList.remove("active");

    gameOverScreen.classList.remove("active");

    screen.classList.add("active");

}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    initializeAudio();

    if (timer) {

        clearInterval(timer);

    }

    if (countdownTimer) {

        clearInterval(countdownTimer);

    }

    score = 0;

    streak = 0;

    timeLeft = 30;

    round = 0;

    gameRunning = false;

    countdownRunning = true;

    scoreValue.textContent = "0";

    streakValue.textContent = "0";

    timeValue.textContent = "30";

    playArea.innerHTML = "";

    showScreen(countdownScreen);

    startCountdown();

}


/* =====================================================
   COUNTDOWN
===================================================== */

function startCountdown() {

    let number = 3;

    countdownNumber.textContent = number;

    countdownNumber.style.animation = "none";

    void countdownNumber.offsetWidth;

    countdownNumber.style.animation =
        "countdownPop 0.8s ease-out";

    playCountdownSound(number);

    vibrateCountdown();


    countdownTimer =
        setInterval(function () {

            number--;

            if (number > 0) {

                countdownNumber.textContent =
                    number;

                countdownNumber.style.animation =
                    "none";

                void countdownNumber.offsetWidth;

                countdownNumber.style.animation =
                    "countdownPop 0.8s ease-out";

                playCountdownSound(number);

                vibrateCountdown();

            } else {

                clearInterval(countdownTimer);

                countdownTimer = null;

                countdownNumber.textContent = "GO";

                countdownNumber.style.animation =
                    "none";

                void countdownNumber.offsetWidth;

                countdownNumber.style.animation =
                    "countdownPop 0.8s ease-out";

                playCountdownSound(0);

                vibrateGo();

                setTimeout(
                    beginActualGame,
                    450
                );

            }

        }, 850);

}


/* =====================================================
   BEGIN ACTUAL GAME
===================================================== */

function beginActualGame() {

    countdownRunning = false;

    gameRunning = true;

    showScreen(gameScreen);

    createRound();

    timer =
        setInterval(function () {

            if (!gameRunning) {
                return;
            }

            timeLeft--;

            timeValue.textContent =
                timeLeft;

            if (timeLeft <= 5 && timeLeft > 0) {

                playFinalSecondsSound();

            }

            if (timeLeft <= 0) {

                endGame();

            }

        }, 1000);

}


/* =====================================================
   END GAME
===================================================== */

function endGame() {

    if (!gameRunning) {
        return;
    }

    gameRunning = false;

    clearInterval(timer);

    timer = null;

    playArea.innerHTML = "";

    playWrongSound();

    vibrateWrong();

    finalScore.textContent = score;

    const oldBest = getHighScore();

    if (score > oldBest) {

        saveHighScore(score);

        newBest.classList.add("show");

    } else {

        newBest.classList.remove("show");

    }

    updateBestDisplays();

    showScreen(gameOverScreen);

}


/* =====================================================
   DIFFICULTY
===================================================== */

function getTargetCount() {

    if (score < 5) {

        return 2;

    }

    if (score < 10) {

        return 3;

    }

    if (score < 20) {

        return 4;

    }

    if (score < 35) {

        return 5;

    }

    return 6;

}


function getTargetSize() {

    if (score < 5) {

        return 100;

    }

    if (score < 10) {

        return 95;

    }

    if (score < 20) {

        return 90;

    }

    if (score < 35) {

        return 85;

    }

    return 80;

}


/* =====================================================
   STREAK MESSAGE
===================================================== */

function showStreakMessage() {

    const milestones = [
        5,
        10,
        15,
        20,
        25,
        30,
        40,
        50
    ];

    if (
        milestones.includes(streak)
    ) {

        streakMessage.textContent =
            streak + " STREAK!";

        streakMessage.classList.remove("show");

        void streakMessage.offsetWidth;

        streakMessage.classList.add("show");

        playStreakSound();

        vibrateStreak();

    }

}


/* =====================================================
   COLLISION CHECK
===================================================== */

function circlesOverlap(
    x1,
    y1,
    x2,
    y2,
    size,
    gap
) {

    const center1X =
        x1 + size / 2;

    const center1Y =
        y1 + size / 2;

    const center2X =
        x2 + size / 2;

    const center2Y =
        y2 + size / 2;

    const dx =
        center1X - center2X;

    const dy =
        center1Y - center2Y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    return distance <
        size + gap;

}


/* =====================================================
   POSITION ALL TARGETS WITHOUT OVERLAP
===================================================== */

function positionTargetsWithoutOverlap(
    targets
) {

    if (!targets.length) {
        return;
    }

    const areaWidth =
        playArea.clientWidth;

    const areaHeight =
        playArea.clientHeight;

    const targetSize =
        targets[0].offsetWidth;

    const padding = 12;

    const gap = 10;

    const positions = [];

    targets.forEach(function (target) {

        let placed = false;

        let attempts = 0;

        while (
            !placed &&
            attempts < 250
        ) {

            attempts++;

            const maxX =
                Math.max(
                    padding,
                    areaWidth -
                    targetSize -
                    padding
                );

            const maxY =
                Math.max(
                    padding,
                    areaHeight -
                    targetSize -
                    padding
                );

            const x =
                padding +
                Math.random() *
                Math.max(
                    1,
                    maxX - padding
                );

            const y =
                padding +
                Math.random() *
                Math.max(
                    1,
                    maxY - padding
                );

            let overlaps = false;

            for (
                let i = 0;
                i < positions.length;
                i++
            ) {

                if (
                    circlesOverlap(
                        x,
                        y,
                        positions[i].x,
                        positions[i].y,
                        targetSize,
                        gap
                    )
                ) {

                    overlaps = true;

                    break;

                }

            }

            if (!overlaps) {

                positions.push({
                    x: x,
                    y: y
                });

                target.style.left =
                    x + "px";

                target.style.top =
                    y + "px";

                placed = true;

            }

        }


        /*
         * Fallback:
         * If random placement cannot find
         * enough space, use a simple grid.
         */

        if (!placed) {

            const index =
                positions.length;

            const columns =
                Math.max(
                    1,
                    Math.floor(
                        areaWidth /
                        (targetSize + gap)
                    )
                );

            const column =
                index % columns;

            const row =
                Math.floor(
                    index / columns
                );

            const x =
                padding +
                column *
                (targetSize + gap);

            const y =
                padding +
                row *
                (targetSize + gap);

            target.style.left =
                Math.min(
                    x,
                    Math.max(
                        padding,
                        areaWidth -
                        targetSize -
                        padding
                    )
                ) + "px";

            target.style.top =
                Math.min(
                    y,
                    Math.max(
                        padding,
                        areaHeight -
                        targetSize -
                        padding
                    )
                ) + "px";

            positions.push({
                x: parseFloat(
                    target.style.left
                ),
                y: parseFloat(
                    target.style.top
                )
            });

        }

    });

}


/* =====================================================
   CREATE ROUND
===================================================== */

function createRound() {

    if (!gameRunning) {
        return;
    }

    round++;

    playArea.innerHTML = "";

    const targetCount =
        getTargetCount();

    const targetSize =
        getTargetSize();

    const targets = [];

    const correctIndex =
        Math.floor(
            Math.random() *
            targetCount
        );


    /*
     * First create every target.
     * We position them only after
     * all targets exist.
     */

    for (
        let i = 0;
        i < targetCount;
        i++
    ) {

        const target =
            document.createElement("div");

        target.className =
            "target";

        target.style.width =
            targetSize + "px";

        target.style.height =
            targetSize + "px";

        target.textContent =
            "TAP";

        if (
            i === correctIndex
        ) {

            target.classList.add(
                "correct"
            );

        }

        target.dataset.correct =
            i === correctIndex
                ? "true"
                : "false";

        target.addEventListener(
            "pointerdown",
            handleTargetTap
        );

        playArea.appendChild(target);

        targets.push(target);

    }


    /*
     * Position the entire group
     * without overlapping.
     */

    positionTargetsWithoutOverlap(
        targets
    );

}


/* =====================================================
   TARGET TAP
===================================================== */

function handleTargetTap(event) {

    event.preventDefault();

    if (!gameRunning) {
        return;
    }

    const target =
        event.currentTarget;

    if (
        target.dataset.correct === "true"
    ) {

        score++;

        streak++;

        scoreValue.textContent =
            score;

        streakValue.textContent =
            streak;

        playCorrectSound();

        vibrateCorrect();

        showStreakMessage();

        createRound();

    } else {

        streak = 0;

        streakValue.textContent =
            "0";

        wrongFlash.classList.remove(
            "show"
        );

        void wrongFlash.offsetWidth;

        wrongFlash.classList.add(
            "show"
        );

        endGame();

    }

}


/* =====================================================
   BUTTON EVENTS
===================================================== */

startButton.addEventListener(
    "pointerdown",
    function (event) {

        event.preventDefault();

        startGame();

    }
);


playAgainButton.addEventListener(
    "pointerdown",
    function (event) {

        event.preventDefault();

        startGame();

    }
);


/* =====================================================
   PREVENT MOBILE GESTURES
===================================================== */

document.addEventListener(
    "contextmenu",
    function (event) {

        event.preventDefault();

    }
);


document.addEventListener(
    "touchmove",
    function (event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturestart",
    function (event) {

        event.preventDefault();

    }
);


/* =====================================================
   RESIZE / ROTATION
===================================================== */

window.addEventListener(
    "resize",
    function () {

        if (!gameRunning) {
            return;
        }

        const targets =
            Array.from(
                playArea.querySelectorAll(
                    ".target"
                )
            );

        positionTargetsWithoutOverlap(
            targets
        );

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

updateBestDisplays();

</script>
