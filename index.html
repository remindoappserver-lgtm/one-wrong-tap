<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <title>ONE WRONG TAP</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="app">

        <!-- =====================================================
             TOP BAR
        ====================================================== -->

        <header class="topbar">

            <div class="logo">
                ONE WRONG <span>TAP</span>
            </div>

            <button
                id="soundBtn"
                class="icon-btn"
                type="button"
                aria-label="Toggle sound"
            >
                🔊
            </button>

        </header>


        <!-- =====================================================
             STATS
        ====================================================== -->

        <section class="stats">

            <div class="stat">
                <small>SCORE</small>
                <strong id="score">0</strong>
            </div>

            <div class="stat">
                <small>BEST</small>
                <strong id="best">0</strong>
            </div>

            <div class="stat">
                <small>LEVEL</small>
                <strong id="level">1</strong>
            </div>

        </section>


        <!-- =====================================================
             GAME CARD
        ====================================================== -->

        <section
            id="gameCard"
            class="game-card"
        >


            <!-- =================================================
                 START SCREEN
            ================================================== -->

            <div
                id="startScreen"
                class="overlay"
            >

                <div class="hero-icon">
                    ⚡
                </div>

                <h1>
                    ONE WRONG TAP
                </h1>

                <p>
                    Tap every safe tile.<br>
                    <b>Do NOT tap red.</b>
                </p>

                <button
                    id="startBtn"
                    class="main-btn"
                    type="button"
                >
                    START GAME
                </button>

                <p class="hint">
                    The game gets faster as you score.
                </p>

            </div>


            <!-- =================================================
                 GAME OVER SCREEN
            ================================================== -->

            <div
                id="gameOverScreen"
                class="overlay hidden"
            >

                <div
                    id="resultBadge"
                    class="result-badge"
                >
                    GAME OVER
                </div>

                <h2 id="finalScore">
                    0
                </h2>

                <p id="recordText">
                    Score
                </p>


                <!-- Future rewarded advertisement -->
                <button
                    id="continueBtn"
                    class="main-btn secondary"
                    type="button"
                >
                    WATCH AD &amp; CONTINUE
                </button>


                <button
                    id="restartBtn"
                    class="main-btn"
                    type="button"
                >
                    PLAY AGAIN
                </button>

            </div>


            <!-- =================================================
                 GAME AREA
            ================================================== -->

            <div
                id="gameArea"
                class="game-area hidden"
                aria-label="Game area"
            >
            </div>


            <!-- =================================================
                 COUNTDOWN
            ================================================== -->

            <div
                id="countdown"
                class="countdown hidden"
            >
                3
            </div>


            <!-- =================================================
                 SCREEN FLASH
            ================================================== -->

            <div
                id="flash"
                class="flash"
            >
            </div>

        </section>


        <!-- =====================================================
             INSTRUCTIONS
        ====================================================== -->

        <section class="instructions">

            <div>

                <span class="safe-dot"></span>

                <b>SAFE</b>

                <small>
                    Tap it
                </small>

            </div>


            <div>

                <span class="danger-dot"></span>

                <b>RED</b>

                <small>
                    Don't tap
                </small>

            </div>


            <div>

                <span class="score-dot">
                    +
                </span>

                <b>POINT</b>

                <small>
                    Keep going
                </small>

            </div>

        </section>


        <!-- =====================================================
             FOOTER
        ====================================================== -->

        <footer>

            <span>
                ONE WRONG TAP
            </span>

            <span>
                •
            </span>

            <span>
                Can you beat your record?
            </span>

        </footer>

    </main>


    <script src="game.js"></script>

</body>
</html>
