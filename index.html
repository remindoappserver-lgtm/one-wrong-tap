<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>ONE WRONG TAP</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #070707;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    width: 100%;
    height: 100%;
    max-width: 650px;

    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #202020 0%,
            #0c0c0c 55%,
            #050505 100%
        );

    color: white;
}

.screen {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 25px;
}

.hidden {
    display: none !important;
}


/* =====================================================
   START SCREEN
===================================================== */

.logo {
    font-size:
        clamp(
            42px,
            11vw,
            78px
        );

    line-height: .9;

    font-weight: 900;

    letter-spacing: -3px;

    margin: 0;
}

.logo span {
    color: #fcc224;
}

.tagline {
    margin-top: 22px;

    color: #aaa;

    font-size: 16px;

    letter-spacing: 1px;
}

.startButton,
.restartButton {

    margin-top: 42px;

    min-width: 210px;
    min-height: 62px;

    padding:
        18px 35px;

    border: 0;

    border-radius: 14px;

    background: #fcc224;

    color: #080808;

    font-size: 18px;

    font-weight: 900;

    letter-spacing: 1px;

    box-shadow:
        0 8px 30px
        rgba(
            252,
            194,
            36,
            .2
        );

    touch-action: manipulation;
}

.startButton:active,
.restartButton:active {

    transform:
        scale(.95);
}

.startBest {

    margin-top: 28px;

    color: #777;

    font-size: 12px;

    letter-spacing: 2px;
}

.startBest strong {

    color: #fcc224;

    font-size: 18px;

    margin-left: 6px;
}


/* =====================================================
   GAME SCREEN
===================================================== */

#gameScreen {

    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
}

#hud {

    height: 92px;

    flex-shrink: 0;

    display: flex;

    justify-content: space-around;

    align-items: center;

    background:
        rgba(
            0,
            0,
            0,
            .85
        );

    border-bottom:
        1px solid
        rgba(
            255,
            255,
            255,
            .08
        );

    z-index: 100;
}

.hudItem {

    min-width: 70px;

    text-align: center;
}

.hudLabel {

    display: block;

    color: #777;

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 5px;
}

.hudValue {

    font-size: 29px;

    font-weight: 900;
}

#timeValue {
    color: #fcc224;
}

#bestValue {
    color: #999;
}

#streakValue {
    color: #fcc224;
}

#playArea {

    position: relative;

    flex: 1;

    overflow: hidden;

    touch-action: none;
}


/* =====================================================
   COUNTDOWN
===================================================== */

#countdown {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    z-index: 500;

    pointer-events: none;

    color: #fcc224;

    font-size:
        clamp(
            90px,
            25vw,
            150px
        );

    font-weight: 900;

    line-height: 1;

    text-shadow:
        0 0 40px
        rgba(
            252,
            194,
            36,
            .5
        );

    opacity: 0;
}

#countdown.show {

    animation:
        countdownAnimation
        .8s ease-out;
}

#countdown.go {

    font-size:
        clamp(
            70px,
            20vw,
            120px
        );
}

@keyframes countdownAnimation {

    0% {

        opacity: 0;

        transform:
            translate(
                -50%,
                -50%
            )
            scale(.55);
    }

    25% {

        opacity: 1;

        transform:
            translate(
                -50%,
                -50%
            )
            scale(1.12);
    }

    55% {

        opacity: 1;

        transform:
            translate(
                -50%,
                -50%
            )
            scale(1);
    }

    100% {

        opacity: 0;

        transform:
            translate(
                -50%,
                -50%
            )
            scale(1.25);
    }
}


/* =====================================================
   TARGETS
===================================================== */

.target {

    position: absolute;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 18px;

    font-weight: 900;

    cursor: pointer;

    touch-action: none;

    transition:
        transform .08s ease,
        width .15s ease,
        height .15s ease;
}

.correct {

    background: #fcc224;

    color: #080808;

    box-shadow:
        0 0 0 6px
        rgba(
            252,
            194,
            36,
            .12
        ),
        0 0 35px
        rgba(
            252,
            194,
            36,
            .35
        );
}

.wrong {

    background: #eeeeee;

    color: #151515;

    box-shadow:
        0 0 0 5px
        rgba(
            255,
            255,
            255,
            .08
        );
}

.target:active {

    transform:
        scale(.88);
}


/* =====================================================
   STREAK
===================================================== */

#streakMessage {

    position: absolute;

    left: 50%;
    top: 28%;

    transform:
        translate(
            -50%,
            -50%
        );

    z-index: 150;

    pointer-events: none;

    opacity: 0;

    color: #fcc224;

    font-size:
        clamp(
            30px,
            8vw,
            48px
        );

    font-weight: 900;

    letter-spacing: 3px;

    text-shadow:
        0 0 25px
        rgba(
            252,
            194,
            36,
            .55
        );
}

#streakMessage.show {

    animation:
        streakAnimation
        .65s ease-out;
}

@keyframes streakAnimation {

    0% {

        opacity: 0;

        transform:
            translate(
                -50%,
                -50%
            )
            scale(.65);
    }

    20% {

        opacity: 1;

        transform:
            translate(
                -50%,
                -50%
            )
            scale(1.15);
    }

    45% {

        opacity: 1;

        transform:
            translate(
                -50%,
                -50%
            )
            scale(1);
    }

    100% {

        opacity: 0;

        transform:
            translate(
                -50%,
                -65%
            )
            scale(1.05);
    }
}


/* =====================================================
   WRONG FLASH
===================================================== */

#wrongFlash {

    position: absolute;

    inset: 0;

    background:
        rgba(
            255,
            0,
            0,
            .35
        );

    opacity: 0;

    pointer-events: none;

    z-index: 200;
}

#wrongFlash.show {

    animation:
        wrongFlashAnimation
        .35s ease;
}

@keyframes wrongFlashAnimation {

    0% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}


/* =====================================================
   GAME OVER
===================================================== */

#gameOverScreen {

    background:
        radial-gradient(
            circle at center,
            #251b1b 0%,
            #0c0808 55%,
            #050505 100%
        );
}

.gameOverTitle {

    font-size:
        clamp(
            44px,
            12vw,
            70px
        );

    font-weight: 900;

    margin: 0;
}

.gameOverSub {

    margin-top: 12px;

    color: #999;
}

.finalScore {

    margin-top: 12px;

    font-size: 86px;

    line-height: 1;

    font-weight: 900;

    color: #fcc224;
}

.newBest {

    margin-top: 10px;

    min-height: 22px;

    color: #fcc224;

    font-size: 14px;

    font-weight: 900;

    letter-spacing: 2px;
}

.bestResult {

    margin-top: 4px;

    color: #777;

    font-size: 12px;

    letter-spacing: 2px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 380px) {

    #hud {
        height: 78px;
    }

    .hudItem {
        min-width: 60px;
    }

    .hudValue {
        font-size: 23px;
    }

    .target {

        width: 82px;
        height: 82px;

        font-size: 15px;
    }
}


@media (orientation: landscape)
       and (max-height: 500px) {

    #hud {
        height: 65px;
    }

    .target {

        width: 75px;
        height: 75px;

        font-size: 14px;
    }

    .startButton,
    .restartButton {

        margin-top: 22px;
    }
}

</style>
</head>

<body>

<div id="app">


<!-- =====================================================
     START SCREEN
===================================================== -->

<section
    id="startScreen"
    class="screen"
>

    <h1 class="logo">

        ONE<br>

        <span>
            WRONG TAP
        </span>

    </h1>

    <p class="tagline">
        One wrong tap and it's over.
    </p>

    <div class="startBest">

        BEST

        <strong id="startBestValue">
            0
        </strong>

    </div>

    <button
        id="startButton"
        class="startButton"
        type="button"
    >
        START GAME
    </button>

</section>


<!-- =====================================================
     GAME SCREEN
===================================================== -->

<section
    id="gameScreen"
    class="hidden"
>

    <div id="hud">

        <div class="hudItem">

            <span class="hudLabel">
                TIME
            </span>

            <strong
                id="timeValue"
                class="hudValue"
            >
                30
            </strong>

        </div>


        <div class="hudItem">

            <span class="hudLabel">
                SCORE
            </span>

            <strong
                id="scoreValue"
                class="hudValue"
            >
                0
            </strong>

        </div>


        <div class="hudItem">

            <span class="hudLabel">
                BEST
            </span>

            <strong
                id="bestValue"
                class="hudValue"
            >
                0
            </strong>

        </div>


        <div class="hudItem">

            <span class="hudLabel">
                STREAK
            </span>

            <strong
                id="streakValue"
                class="hudValue"
            >
                0
            </strong>

        </div>

    </div>


    <div id="playArea">

        <div id="wrongFlash"></div>

        <div id="streakMessage"></div>

        <div id="countdown"></div>

    </div>

</section>


<!-- =====================================================
     GAME OVER
===================================================== -->

<section
    id="gameOverScreen"
    class="screen hidden"
>

    <h2 class="gameOverTitle">
        GAME OVER
    </h2>

    <p class="gameOverSub">
        FINAL SCORE
    </p>

    <div
        id="finalScore"
        class="finalScore"
    >
        0
    </div>

    <div
        id="newBest"
        class="newBest"
    ></div>

    <div class="bestResult">

        BEST:

        <span id="finalBest">
            0
        </span>

    </div>

    <button
        id="restartButton"
        class="restartButton"
        type="button"
    >
        PLAY AGAIN
    </button>

</section>

</div>


<script>

(function () {

"use strict";


/* =====================================================
   ELEMENTS
===================================================== */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const gameScreen =
    document.getElementById(
        "gameScreen"
    );

const gameOverScreen =
    document.getElementById(
        "gameOverScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const restartButton =
    document.getElementById(
        "restartButton"
    );

const playArea =
    document.getElementById(
        "playArea"
    );

const scoreValue =
    document.getElementById(
        "scoreValue"
    );

const timeValue =
    document.getElementById(
        "timeValue"
    );

const bestValue =
    document.getElementById(
        "bestValue"
    );

const streakValue =
    document.getElementById(
        "streakValue"
    );

const startBestValue =
    document.getElementById(
        "startBestValue"
    );

const finalScore =
    document.getElementById(
        "finalScore"
    );

const finalBest =
    document.getElementById(
        "finalBest"
    );

const newBest =
    document.getElementById(
        "newBest"
    );

const streakMessage =
    document.getElementById(
        "streakMessage"
    );

const wrongFlash =
    document.getElementById(
        "wrongFlash"
    );

const countdown =
    document.getElementById(
        "countdown"
    );


/* =====================================================
   GAME VARIABLES
===================================================== */

let score = 0;

let streak = 0;

let timeLeft = 30;

let gameRunning = false;

let countdownRunning = false;

let timer = null;

let countdownTimer = null;

let round = 0;


/* =====================================================
   HIGH SCORE
===================================================== */

const HIGH_SCORE_KEY =
    "oneWrongTapHighScore";


function getHighScore() {

    const saved =
        localStorage.getItem(
            HIGH_SCORE_KEY
        );

    const number =
        parseInt(
            saved,
            10
        );

    if (
        Number.isFinite(number) &&
        number >= 0
    ) {

        return number;
    }

    return 0;
}


function saveHighScore(value) {

    localStorage.setItem(
        HIGH_SCORE_KEY,
        String(value)
    );
}


/* =====================================================
   SOUND SYSTEM
===================================================== */

let audioContext = null;


function initializeAudio() {

    try {

        if (!audioContext) {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContext) {
                return;
            }

            audioContext =
                new AudioContext();
        }

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();
        }

    } catch (error) {

        console.log(
            "Audio unavailable"
        );
    }
}


function playTone(
    frequency,
    duration,
    volume,
    type,
    delay
) {

    if (!audioContext) {
        return;
    }

    try {

        const startTime =
            audioContext.currentTime +
            (delay || 0);

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            type || "sine";

        oscillator.frequency.setValueAtTime(
            frequency,
            startTime
        );

        gain.gain.setValueAtTime(
            0.0001,
            startTime
        );

        gain.gain.exponentialRampToValueAtTime(
            volume,
            startTime + 0.01
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            startTime + duration
        );

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start(
            startTime
        );

        oscillator.stop(
            startTime +
            duration +
            0.02
        );

    } catch (error) {

        /* Ignore audio errors */
    }
}


function playCorrectSound() {

    playTone(
        760,
        0.07,
        0.045,
        "sine",
        0
    );
}


function playStreakSound() {

    playTone(
        660,
        0.10,
        0.055,
        "sine",
        0
    );

    playTone(
        880,
        0.12,
        0.06,
        "sine",
        0.08
    );

    playTone(
        1100,
        0.14,
        0.05,
        "sine",
        0.17
    );
}


function playWrongSound() {

    playTone(
        180,
        0.20,
        0.08,
        "sawtooth",
        0
    );

    playTone(
        120,
        0.28,
        0.06,
        "sawtooth",
        0.08
    );
}


function playFinalSecondsSound() {

    playTone(
        520,
        0.045,
        0.025,
        "sine",
        0
    );
}


function playCountdownSound(
    number
) {

    if (
        number === "GO!"
    ) {

        playTone(
            880,
            0.12,
            0.06,
            "sine",
            0
        );

        playTone(
            1100,
            0.15,
            0.055,
            "sine",
            0.09
        );

        return;
    }

    playTone(
        440,
        0.10,
        0.045,
        "sine",
        0
    );
}


/* =====================================================
   BEST DISPLAY
===================================================== */

function updateBestDisplays() {

    const best =
        getHighScore();

    startBestValue.textContent =
        best;

    bestValue.textContent =
        best;

    finalBest.textContent =
        best;
}


/* =====================================================
   SCREEN FUNCTIONS
===================================================== */

function showStartScreen() {

    startScreen.classList.remove(
        "hidden"
    );

    gameScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );

    updateBestDisplays();
}


function showGameScreen() {

    startScreen.classList.add(
        "hidden"
    );

    gameScreen.classList.remove(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );
}


function showGameOverScreen() {

    startScreen.classList.add(
        "hidden"
    );

    gameScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.remove(
        "hidden"
    );
}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    initializeAudio();

    clearInterval(timer);

    clearInterval(
        countdownTimer
    );

    score = 0;

    streak = 0;

    timeLeft = 30;

    round = 0;

    gameRunning = false;

    countdownRunning = true;


    scoreValue.textContent =
        "0";

    streakValue.textContent =
        "0";

    timeValue.textContent =
        "30";

    updateBestDisplays();

    newBest.textContent =
        "";

    streakMessage.textContent =
        "";


    playArea
        .querySelectorAll(
            ".target"
        )
        .forEach(
            function (element) {

                element.remove();
            }
        );


    showGameScreen();


    startCountdown();
}


/* =====================================================
   COUNTDOWN
===================================================== */

function startCountdown() {

    let count = 3;


    countdown.textContent =
        count;

    countdown.classList.remove(
        "show",
        "go"
    );

    void countdown.offsetWidth;

    countdown.classList.add(
        "show"
    );

    playCountdownSound(
        String(count)
    );


    countdownTimer =
        setInterval(
            function () {

                count--;


                if (count > 0) {

                    countdown.textContent =
                        count;

                    countdown.classList.remove(
                        "show"
                    );

                    void countdown.offsetWidth;

                    countdown.classList.add(
                        "show"
                    );

                    playCountdownSound(
                        String(count)
                    );

                    return;
                }


                if (count === 0) {

                    countdown.textContent =
                        "GO!";

                    countdown.classList.remove(
                        "show"
                    );

                    countdown.classList.add(
                        "go"
                    );

                    void countdown.offsetWidth;

                    countdown.classList.add(
                        "show"
                    );

                    playCountdownSound(
                        "GO!"
                    );


                    clearInterval(
                        countdownTimer
                    );


                    setTimeout(
                        function () {

                            countdown.classList.remove(
                                "show"
                            );

                            countdownRunning =
                                false;

                            beginActualGame();

                        },
                        500
                    );
                }

            },
            800
        );
}


/* =====================================================
   ACTUAL GAME START
===================================================== */

function beginActualGame() {

    gameRunning = true;

    timeLeft = 30;

    timeValue.textContent =
        "30";


    requestAnimationFrame(
        function () {

            createRound();
        }
    );


    timer =
        setInterval(
            function () {

                if (!gameRunning) {
                    return;
                }


                timeLeft--;

                timeValue.textContent =
                    timeLeft;


                if (
                    timeLeft <= 5 &&
                    timeLeft > 0
                ) {

                    playFinalSecondsSound();
                }


                if (
                    timeLeft <= 0
                ) {

                    endGame();
                }

            },
            1000
        );
}


/* =====================================================
   GAME OVER
===================================================== */

function endGame() {

    gameRunning = false;

    countdownRunning = false;

    clearInterval(timer);

    clearInterval(
        countdownTimer
    );

    playWrongSound();


    const oldBest =
        getHighScore();

    let isNewBest = false;


    if (
        score > oldBest
    ) {

        saveHighScore(
            score
        );

        isNewBest = true;
    }


    finalScore.textContent =
        score;


    if (isNewBest) {

        newBest.textContent =
            "NEW BEST!";

    } else {

        newBest.textContent =
            "";
    }


    updateBestDisplays();


    playArea
        .querySelectorAll(
            ".target"
        )
        .forEach(
            function (element) {

                element.remove();
            }
        );


    showGameOverScreen();
}


/* =====================================================
   DIFFICULTY
===================================================== */

function getTargetCount() {

    if (score < 5) {

        return 2;
    }

    if (score < 10) {

        return 3;
    }

    if (score < 20) {

        return 4;
    }

    if (score < 35) {

        return 5;
    }

    return 6;
}


function getTargetSize() {

    if (score < 5) {

        return 100;
    }

    if (score < 10) {

        return 95;
    }

    if (score < 20) {

        return 90;
    }

    if (score < 35) {

        return 85;
    }

    return 80;
}


/* =====================================================
   STREAK MESSAGE
===================================================== */

function showStreakMessage() {

    const streaks = [

        5,
        10,
        15,
        20,
        25,
        30,
        40,
        50

    ];


    if (
        !streaks.includes(
            streak
        )
    ) {

        return;
    }


    streakMessage.textContent =
        streak + " STREAK!";


    streakMessage.classList.remove(
        "show"
    );


    void streakMessage.offsetWidth;


    streakMessage.classList.add(
        "show"
    );


    playStreakSound();
}


/* =====================================================
   CREATE ROUND
===================================================== */

function createRound() {

    if (!gameRunning) {

        return;
    }


    round++;


    playArea
        .querySelectorAll(
            ".target"
        )
        .forEach(
            function (element) {

                element.remove();
            }
        );


    const targetCount =
        getTargetCount();


    const targetSize =
        getTargetSize();


    const correctIndex =
        Math.floor(
            Math.random() *
            targetCount
        );


    for (
        let i = 0;
        i < targetCount;
        i++
    ) {

        const target =
            document.createElement(
                "div"
            );


        target.className =
            "target";


        target.style.width =
            targetSize + "px";


        target.style.height =
            targetSize + "px";


        if (
            i === correctIndex
        ) {

            target.classList.add(
                "correct"
            );

            target.textContent =
                "TAP";

            target.dataset.correct =
                "true";

        } else {

            target.classList.add(
                "wrong"
            );

            target.textContent =
                "TAP";

            target.dataset.correct =
                "false";
        }


        playArea.appendChild(
            target
        );


        positionTarget(
            target
        );


        target.addEventListener(
            "pointerdown",
            handleTargetTap,
            {
                passive: false
            }
        );
    }
}


/* =====================================================
   TARGET POSITION
===================================================== */

function positionTarget(
    target
) {

    const areaWidth =
        playArea.clientWidth;


    const areaHeight =
        playArea.clientHeight;


    const targetSize =
        target.offsetWidth;


    const padding = 15;


    const maxX =
        Math.max(
            0,
            areaWidth -
            targetSize -
            padding * 2
        );


    const maxY =
        Math.max(
            0,
            areaHeight -
            targetSize -
            padding * 2
        );


    const x =
        padding +
        Math.random() *
        maxX;


    const y =
        padding +
        Math.random() *
        maxY;


    target.style.left =
        x + "px";


    target.style.top =
        y + "px";
}


/* =====================================================
   TARGET TAP
===================================================== */

function handleTargetTap(
    event
) {

    event.preventDefault();

    event.stopPropagation();


    if (!gameRunning) {

        return;
    }


    const tappedTarget =
        event.currentTarget;


    const isCorrect =
        tappedTarget.dataset.correct
        === "true";


    if (!isCorrect) {

        streak = 0;

        streakValue.textContent =
            "0";


        wrongFlash.classList.remove(
            "show"
        );


        void wrongFlash.offsetWidth;


        wrongFlash.classList.add(
            "show"
        );


        endGame();

        return;
    }


    score++;

    streak++;


    scoreValue.textContent =
        score;


    streakValue.textContent =
        streak;


    playCorrectSound();


    showStreakMessage();


    createRound();
}


/* =====================================================
   START BUTTON
===================================================== */

startButton.addEventListener(

    "pointerdown",

    function (event) {

        event.preventDefault();

        event.stopPropagation();

        startGame();

    },

    {
        passive: false
    }
);


/* =====================================================
   RESTART BUTTON
===================================================== */

restartButton.addEventListener(

    "pointerdown",

    function (event) {

        event.preventDefault();

        event.stopPropagation();

        startGame();

    },

    {
        passive: false
    }
);


/* =====================================================
   TOUCH PROTECTION
===================================================== */

document.addEventListener(

    "touchmove",

    function (event) {

        event.preventDefault();

    },

    {
        passive: false
    }
);


document.addEventListener(

    "gesturestart",

    function (event) {

        event.preventDefault();

    }
);


document.addEventListener(

    "contextmenu",

    function (event) {

        event.preventDefault();

    }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

    "resize",

    function () {

        if (!gameRunning) {

            return;
        }


        playArea
            .querySelectorAll(
                ".target"
            )
            .forEach(
                function (target) {

                    positionTarget(
                        target
                    );
                }
            );
    }
);


/* =====================================================
   INITIALIZE
===================================================== */

updateBestDisplays();

showStartScreen();

})();

</script>
