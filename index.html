<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>One Wrong Tap</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="game">

        <!-- START SCREEN -->
        <section id="startScreen" class="screen">
            <h1>ONE WRONG TAP</h1>

            <p class="subtitle">
                One wrong tap and you're out.
            </p>

            <button id="startButton" type="button">
                START GAME
            </button>
        </section>


        <!-- GAME SCREEN -->
        <section id="gameScreen" class="screen hidden">

            <div class="topBar">

                <div class="stat">
                    <span>TIME</span>
                    <strong id="timer">30</strong>
                </div>

                <div class="stat">
                    <span>SCORE</span>
                    <strong id="score">0</strong>
                </div>

            </div>


            <!--
                Everything inside this area can receive
                phone taps and mouse clicks.
            -->
            <div id="tapArea">

                <div id="target">
                    TAP
                </div>

            </div>

        </section>


        <!-- GAME OVER SCREEN -->
        <section id="gameOverScreen" class="screen hidden">

            <h2>GAME OVER</h2>

            <p>Your Score</p>

            <div id="finalScore">
                0
            </div>

            <button id="restartButton" type="button">
                PLAY AGAIN
            </button>

        </section>

    </main>


    <script src="game.js"></script>

</body>
</html>
