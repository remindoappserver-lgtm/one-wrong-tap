<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>ONE WRONG TAP</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #070707;

    font-family: Arial, Helvetica, sans-serif;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    width: 100%;
    height: 100%;
    max-width: 650px;

    position: relative;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #202020 0%,
            #0c0c0c 55%,
            #050505 100%
        );

    color: white;
}


/* =========================================================
   SCREENS
========================================================= */

.screen {
    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 25px;
}

.hidden {
    display: none !important;
}


/* =========================================================
   START
========================================================= */

.logo {
    font-size: clamp(42px, 11vw, 78px);

    line-height: .9;

    font-weight: 900;

    letter-spacing: -3px;

    margin: 0;
}

.logo span {
    color: #fcc224;
}

.tagline {
    margin-top: 22px;

    color: #aaa;

    font-size: 16px;

    letter-spacing: 1px;
}

.startButton,
.restartButton {

    margin-top: 42px;

    min-width: 210px;

    min-height: 62px;

    padding: 18px 35px;

    border: 0;

    border-radius: 14px;

    background: #fcc224;

    color: #080808;

    font-size: 18px;

    font-weight: 900;

    letter-spacing: 1px;

    box-shadow:
        0 8px 30px rgba(252,194,36,.2);

    touch-action: manipulation;
}

.startButton:active,
.restartButton:active {
    transform: scale(.95);
}


/* =========================================================
   GAME SCREEN
========================================================= */

#gameScreen {
    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;
}


/* =========================================================
   HUD
========================================================= */

#hud {

    height: 92px;

    flex-shrink: 0;

    display: flex;

    justify-content: space-around;

    align-items: center;

    background: rgba(0,0,0,.85);

    border-bottom:
        1px solid rgba(255,255,255,.08);

    z-index: 100;
}

.hudItem {
    min-width: 100px;
}

.hudLabel {

    display: block;

    color: #777;

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 5px;
}

.hudValue {

    font-size: 29px;

    font-weight: 900;
}

#timeValue {
    color: #fcc224;
}


/* =========================================================
   PLAY AREA
========================================================= */

#playArea {

    position: relative;

    flex: 1;

    overflow: hidden;

    touch-action: none;
}


/* =========================================================
   TARGETS
========================================================= */

.target {

    position: absolute;

    width: 100px;

    height: 100px;

    border-radius: 50%;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 18px;

    font-weight: 900;

    cursor: pointer;

    touch-action: none;

    transition:
        transform .08s ease;

}


/* CORRECT TARGET */

.correct {

    background: #fcc224;

    color: #080808;

    box-shadow:

        0 0 0 6px
        rgba(252,194,36,.12),

        0 0 35px
        rgba(252,194,36,.35);
}


/* WRONG TARGETS */

.wrong {

    background: #eeeeee;

    color: #151515;

    box-shadow:

        0 0 0 5px
        rgba(255,255,255,.08);

}


/* TAP FEEDBACK */

.target:active {
    transform: scale(.88);
}


/* =========================================================
   WRONG FLASH
========================================================= */

#wrongFlash {

    position: absolute;

    inset: 0;

    background:
        rgba(255,0,0,.35);

    opacity: 0;

    pointer-events: none;

    z-index: 200;
}

#wrongFlash.show {

    animation:
        wrongFlashAnimation .35s ease;
}

@keyframes wrongFlashAnimation {

    0% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }

}


/* =========================================================
   GAME OVER
========================================================= */

#gameOverScreen {

    background:

        radial-gradient(
            circle at center,
            #251b1b 0%,
            #0c0808 55%,
            #050505 100%
        );
}

.gameOverTitle {

    font-size:
        clamp(44px, 12vw, 70px);

    font-weight: 900;

    margin: 0;
}

.gameOverSub {

    margin-top: 12px;

    color: #999;
}

.finalScore {

    margin-top: 12px;

    font-size: 86px;

    line-height: 1;

    font-weight: 900;

    color: #fcc224;
}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 380px) {

    #hud {
        height: 78px;
    }

    .hudValue {
        font-size: 25px;
    }

    .target {

        width: 82px;

        height: 82px;

        font-size: 15px;
    }

}


/* =========================================================
   LANDSCAPE PHONES
========================================================= */

@media (orientation: landscape)
       and (max-height: 500px) {

    #hud {
        height: 65px;
    }

    .target {

        width: 75px;

        height: 75px;

        font-size: 14px;
    }

    .startButton,
    .restartButton {

        margin-top: 22px;
    }

}

</style>
</head>


<body>

<div id="app">


<!-- =======================================================
     START SCREEN
======================================================= -->

<section
    id="startScreen"
    class="screen"
>

    <h1 class="logo">

        ONE<br>

        <span>WRONG TAP</span>

    </h1>

    <p class="tagline">

        One wrong tap and it's over.

    </p>

    <button
        id="startButton"
        class="startButton"
        type="button"
    >

        START GAME

    </button>

</section>



<!-- =======================================================
     GAME SCREEN
======================================================= -->

<section
    id="gameScreen"
    class="hidden"
>

    <div id="hud">

        <div class="hudItem">

            <span class="hudLabel">
                TIME
            </span>

            <strong
                id="timeValue"
                class="hudValue"
            >
                30
            </strong>

        </div>


        <div class="hudItem">

            <span class="hudLabel">
                SCORE
            </span>

            <strong
                id="scoreValue"
                class="hudValue"
            >
                0
            </strong>

        </div>

    </div>


    <div id="playArea">

        <div id="wrongFlash"></div>

    </div>

</section>



<!-- =======================================================
     GAME OVER
======================================================= -->

<section
    id="gameOverScreen"
    class="screen hidden"
>

    <h2 class="gameOverTitle">

        GAME OVER

    </h2>

    <p class="gameOverSub">

        FINAL SCORE

    </p>

    <div
        id="finalScore"
        class="finalScore"
    >
        0
    </div>

    <button
        id="restartButton"
        class="restartButton"
        type="button"
    >

        PLAY AGAIN

    </button>

</section>


</div>



<script>

(function () {

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const startScreen =
    document.getElementById("startScreen");

const gameScreen =
    document.getElementById("gameScreen");

const gameOverScreen =
    document.getElementById("gameOverScreen");

const startButton =
    document.getElementById("startButton");

const restartButton =
    document.getElementById("restartButton");

const playArea =
    document.getElementById("playArea");

const scoreValue =
    document.getElementById("scoreValue");

const timeValue =
    document.getElementById("timeValue");

const finalScore =
    document.getElementById("finalScore");

const wrongFlash =
    document.getElementById("wrongFlash");


/* =========================================================
   GAME VARIABLES
========================================================= */

let score = 0;

let timeLeft = 30;

let gameRunning = false;

let timer = null;

let round = 0;


/* =========================================================
   SCREEN FUNCTIONS
========================================================= */

function showStartScreen() {

    startScreen.classList.remove("hidden");

    gameScreen.classList.add("hidden");

    gameOverScreen.classList.add("hidden");

}


function showGameScreen() {

    startScreen.classList.add("hidden");

    gameScreen.classList.remove("hidden");

    gameOverScreen.classList.add("hidden");

}


function showGameOverScreen() {

    startScreen.classList.add("hidden");

    gameScreen.classList.add("hidden");

    gameOverScreen.classList.remove("hidden");

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    clearInterval(timer);

    score = 0;

    timeLeft = 30;

    round = 0;

    gameRunning = true;

    scoreValue.textContent = "0";

    timeValue.textContent = "30";

    playArea
        .querySelectorAll(".target")
        .forEach(function (element) {

            element.remove();

        });

    showGameScreen();


    requestAnimationFrame(function () {

        createRound();

    });


    timer = setInterval(function () {

        if (!gameRunning) {
            return;
        }

        timeLeft--;

        timeValue.textContent =
            timeLeft;


        if (timeLeft <= 0) {

            endGame();

        }

    }, 1000);

}


/* =========================================================
   END GAME
========================================================= */

function endGame() {

    gameRunning = false;

    clearInterval(timer);

    finalScore.textContent = score;

    playArea
        .querySelectorAll(".target")
        .forEach(function (element) {

            element.remove();

        });

    showGameOverScreen();

}


/* =========================================================
   NUMBER OF TARGETS
========================================================= */

function getTargetCount() {

    /*
       Start easy.

       As the score increases,
       more targets appear.
    */

    if (score < 5) {
        return 2;
    }

    if (score < 10) {
        return 3;
    }

    if (score < 20) {
        return 4;
    }

    if (score < 35) {
        return 5;
    }

    return 6;

}


/* =========================================================
   CREATE ROUND
========================================================= */

function createRound() {

    if (!gameRunning) {
        return;
    }

    round++;

    playArea
        .querySelectorAll(".target")
        .forEach(function (element) {

            element.remove();

        });


    const targetCount =
        getTargetCount();


    /*
       Pick one random target
       to be the CORRECT one.
    */

    const correctIndex =
        Math.floor(
            Math.random() * targetCount
        );


    for (
        let i = 0;
        i < targetCount;
        i++
    ) {

        const target =
            document.createElement("div");

        target.className = "target";


        if (i === correctIndex) {

            target.classList.add("correct");

            target.textContent = "TAP";

            target.dataset.correct = "true";

        } else {

            target.classList.add("wrong");

            target.textContent = "TAP";

            target.dataset.correct = "false";

        }


        positionTarget(target);

        playArea.appendChild(target);


        target.addEventListener(
            "pointerdown",
            handleTargetTap,
            {
                passive: false
            }
        );

    }

}


/* =========================================================
   POSITION TARGET
========================================================= */

function positionTarget(target) {

    const areaWidth =
        playArea.clientWidth;

    const areaHeight =
        playArea.clientHeight;


    const targetSize =
        target.offsetWidth || 100;


    const padding = 15;


    const maxX =
        Math.max(
            0,
            areaWidth -
            targetSize -
            padding * 2
        );


    const maxY =
        Math.max(
            0,
            areaHeight -
            targetSize -
            padding * 2
        );


    const x =
        padding +
        Math.random() * maxX;


    const y =
        padding +
        Math.random() * maxY;


    target.style.left =
        x + "px";

    target.style.top =
        y + "px";

}


/* =========================================================
   HANDLE TARGET TAP
========================================================= */

function handleTargetTap(event) {

    event.preventDefault();

    event.stopPropagation();


    if (!gameRunning) {
        return;
    }


    const tappedTarget =
        event.currentTarget;


    const isCorrect =
        tappedTarget.dataset.correct === "true";


    /* =====================================================
       WRONG TARGET
    ====================================================== */

    if (!isCorrect) {

        wrongFlash.classList.remove("show");

        /*
           Force animation to restart.
        */

        void wrongFlash.offsetWidth;

        wrongFlash.classList.add("show");

        endGame();

        return;

    }


    /* =====================================================
       CORRECT TARGET
    ====================================================== */

    score++;

    scoreValue.textContent =
        score;


    createRound();

}


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "pointerdown",
    function (event) {

        event.preventDefault();

        event.stopPropagation();

        startGame();

    },
    {
        passive: false
    }
);


/* =========================================================
   RESTART BUTTON
========================================================= */

restartButton.addEventListener(
    "pointerdown",
    function (event) {

        event.preventDefault();

        event.stopPropagation();

        startGame();

    },
    {
        passive: false
    }
);


/* =========================================================
   PREVENT PHONE SCROLLING
========================================================= */

document.addEventListener(
    "touchmove",
    function (event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


/* =========================================================
   PREVENT DOUBLE-TAP ZOOM
========================================================= */

document.addEventListener(
    "gesturestart",
    function (event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


/* =========================================================
   PREVENT CONTEXT MENU
========================================================= */

document.addEventListener(
    "contextmenu",
    function (event) {

        event.preventDefault();

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function () {

        if (!gameRunning) {
            return;
        }

        playArea
            .querySelectorAll(".target")
            .forEach(function (target) {

                positionTarget(target);

            });

    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

showStartScreen();

})();

</script>

</body>
</html>
```
