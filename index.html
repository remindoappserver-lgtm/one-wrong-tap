<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ONE WRONG TAP</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at center,
                    #202020 0%,
                    #0d0d0d 55%,
                    #050505 100%
                );
            font-family: Arial, sans-serif;
            color: white;
            touch-action: none;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
        }

        button {
            font-family: Arial, sans-serif;
        }


        /* =====================================================
           START SCREEN
        ===================================================== */

        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 20;
        }

        .screen.hidden {
            display: none;
        }

        .start-content {
            width: 90%;
            max-width: 420px;
        }

        .logo {
            font-size: clamp(42px, 12vw, 78px);
            font-weight: 900;
            line-height: 0.88;
            letter-spacing: -2px;
            color: #fcc224;
            text-shadow:
                0 0 25px rgba(252, 194, 36, 0.20);
        }

        .logo span {
            display: block;
            color: white;
        }

        .tagline {
            margin-top: 22px;
            font-size: 15px;
            color: #999;
            letter-spacing: 1px;
        }

        .best-label {
            margin-top: 38px;
            font-size: 12px;
            color: #777;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .best-score {
            margin-top: 5px;
            font-size: 32px;
            font-weight: 900;
            color: #fcc224;
        }

        .start-button,
        .play-again-button {
            margin-top: 35px;
            width: 100%;
            border: none;
            border-radius: 14px;
            background: #fcc224;
            color: #080808;
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 1px;
            padding: 17px 20px;
            cursor: pointer;
            box-shadow:
                0 8px 30px rgba(252, 194, 36, 0.18);
        }

        .start-button:active,
        .play-again-button:active {
            transform: scale(0.97);
        }


        /* =====================================================
           GAME SCREEN
        ===================================================== */

        #gameScreen {
            position: fixed;
            inset: 0;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 10;
            pointer-events: none;
        }

        .hud-item {
            min-width: 80px;
            text-align: center;
        }

        .hud-label {
            font-size: 9px;
            color: #666;
            letter-spacing: 2px;
            font-weight: 900;
        }

        .hud-value {
            margin-top: 3px;
            font-size: 22px;
            font-weight: 900;
            color: white;
        }

        #score {
            color: #fcc224;
        }


        /* =====================================================
           COMBO
        ===================================================== */

        .combo {
            position: absolute;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 11;
            pointer-events: none;

            font-size: 14px;
            font-weight: 900;
            letter-spacing: 2px;

            color: #fcc224;

            opacity: 0;
            transition: opacity 0.2s ease;

            text-shadow:
                0 0 15px rgba(252, 194, 36, 0.30);
        }

        .combo.active {
            opacity: 1;
        }

        .combo.bump {
            animation: comboBump 0.35s ease-out;
        }

        @keyframes comboBump {

            0% {
                transform:
                    translateX(-50%)
                    scale(1);
            }

            40% {
                transform:
                    translateX(-50%)
                    scale(1.35);
            }

            100% {
                transform:
                    translateX(-50%)
                    scale(1);
            }

        }


        /* =====================================================
           COMBO LOST WARNING
        ===================================================== */

        .combo-lost {
            position: absolute;
            top: 105px;
            left: 50%;
            transform: translateX(-50%) scale(0.7);

            color: #ff3b3b;
            font-size: 17px;
            font-weight: 900;
            letter-spacing: 2px;

            pointer-events: none;
            z-index: 13;

            opacity: 0;
            white-space: nowrap;

            text-shadow:
                0 0 18px rgba(255, 59, 59, 0.45);
        }

        .combo-lost.show {
            animation: comboLostPop 0.65s ease-out;
        }

        @keyframes comboLostPop {

            0% {
                opacity: 0;
                transform:
                    translateX(-50%)
                    scale(0.65);
            }

            25% {
                opacity: 1;
                transform:
                    translateX(-50%)
                    scale(1.15);
            }

            45% {
                opacity: 1;
                transform:
                    translateX(-50%)
                    scale(1);
            }

            100% {
                opacity: 0;
                transform:
                    translateX(-50%)
                    scale(1.05);
            }

        }


        /* =====================================================
           PLAY AREA
        ===================================================== */

        #playArea {
            position: absolute;
            left: 0;
            right: 0;
            top: 68px;
            bottom: 0;
            overflow: hidden;
        }


        /* =====================================================
           TARGETS
        ===================================================== */

        .target {
            position: absolute;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;

            cursor: pointer;

            transition:
                transform 0.08s ease,
                opacity 0.08s ease;

            animation:
                targetAppear 0.18s ease-out,
                targetFloat 2.8s ease-in-out infinite;

            will-change: transform;

            touch-action: none;
        }

        .target.correct {
            background: #fcc224;
            color: #080808;

            box-shadow:
                0 0 24px rgba(252, 194, 36, 0.34);

            animation:
                targetAppear 0.18s ease-out,
                targetFloat 2.8s ease-in-out infinite,
                correctPulse 1.8s ease-in-out infinite;
        }

        .target.wrong {
            background: #f4f4f4;
            color: #111;

            box-shadow:
                0 0 18px rgba(255, 255, 255, 0.10);
        }

        .target.tapped {
            animation:
                targetTap 0.13s ease-out forwards !important;
        }


        /* =====================================================
           STREAK GLOW
        ===================================================== */

        .target.correct.streak-low {
            box-shadow:
                0 0 24px rgba(252, 194, 36, 0.34);
        }

        .target.correct.streak-medium {
            box-shadow:
                0 0 30px rgba(252, 194, 36, 0.40);
        }

        .target.correct.streak-high {
            box-shadow:
                0 0 40px rgba(252, 194, 36, 0.52);
        }

        .target.correct.streak-extreme {
            box-shadow:
                0 0 52px rgba(252, 194, 36, 0.68);
        }


        /* =====================================================
           TARGET ANIMATIONS
        ===================================================== */

        @keyframes targetAppear {

            from {
                opacity: 0;
                transform: scale(0.65);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        @keyframes targetFloat {

            0% {
                margin-top: 0;
                margin-left: 0;
            }

            25% {
                margin-top: -5px;
                margin-left: 4px;
            }

            50% {
                margin-top: 2px;
                margin-left: -4px;
            }

            75% {
                margin-top: 5px;
                margin-left: 3px;
            }

            100% {
                margin-top: 0;
                margin-left: 0;
            }

        }

        @keyframes correctPulse {

            0% {
                box-shadow:
                    0 0 20px rgba(252, 194, 36, 0.28);
            }

            50% {
                box-shadow:
                    0 0 38px rgba(252, 194, 36, 0.48);
            }

            100% {
                box-shadow:
                    0 0 20px rgba(252, 194, 36, 0.28);
            }

        }

        @keyframes targetTap {

            0% {
                transform: scale(1);
                opacity: 1;
            }

            55% {
                transform: scale(0.72);
                opacity: 0.9;
            }

            100% {
                transform: scale(1.12);
                opacity: 0;
            }

        }


        /* =====================================================
           COUNTDOWN
        ===================================================== */

        .countdown {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 15;

            font-size: clamp(70px, 20vw, 140px);
            font-weight: 900;

            color: #fcc224;

            pointer-events: none;

            text-shadow:
                0 0 35px rgba(252, 194, 36, 0.35);

            opacity: 0;
        }

        .countdown.show {
            animation: countdownPop 0.8s ease-out;
        }

        @keyframes countdownPop {

            0% {
                opacity: 0;
                transform: scale(1.5);
            }

            25% {
                opacity: 1;
                transform: scale(1);
            }

            75% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(0.8);
            }

        }


        /* =====================================================
           STREAK MESSAGE
        ===================================================== */

        .streak-message {
            position: absolute;
            left: 50%;
            bottom: 65px;

            transform:
                translateX(-50%)
                translateY(10px);

            z-index: 12;

            color: #fcc224;

            font-size: 14px;
            font-weight: 900;
            letter-spacing: 2px;

            pointer-events: none;

            opacity: 0;

            text-shadow:
                0 0 18px rgba(252, 194, 36, 0.35);
        }

        .streak-message.show {
            animation: streakMessage 0.75s ease-out;
        }

        @keyframes streakMessage {

            0% {
                opacity: 0;
                transform:
                    translateX(-50%)
                    translateY(15px)
                    scale(0.8);
            }

            25% {
                opacity: 1;
                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(1.1);
            }

            50% {
                opacity: 1;
                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(1);
            }

            100% {
                opacity: 0;
                transform:
                    translateX(-50%)
                    translateY(-8px)
                    scale(1.05);
            }

        }


        /* =====================================================
           SCORE POP
        ===================================================== */

        .score-pop {
            position: absolute;

            top: 45px;
            left: 50%;

            transform:
                translateX(-50%)
                translateY(0)
                scale(0.8);

            color: #fcc224;

            font-size: 18px;
            font-weight: 900;

            pointer-events: none;
            z-index: 14;

            opacity: 0;

            text-shadow:
                0 0 15px rgba(252, 194, 36, 0.35);
        }

        .score-pop.show {
            animation: scorePop 0.45s ease-out;
        }

        @keyframes scorePop {

            0% {
                opacity: 0;
                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(0.7);
            }

            30% {
                opacity: 1;
                transform:
                    translateX(-50%)
                    translateY(-8px)
                    scale(1.15);
            }

            100% {
                opacity: 0;
                transform:
                    translateX(-50%)
                    translateY(-25px)
                    scale(1);
            }

        }


        /* =====================================================
           MILESTONE FLASH
        ===================================================== */

        .milestone-flash {
            position: fixed;
            inset: 0;

            pointer-events: none;

            z-index: 18;

            opacity: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(252, 194, 36, 0.22),
                    rgba(252, 194, 36, 0.08) 30%,
                    transparent 65%
                );
        }

        .milestone-flash.show {
            animation:
                milestoneFlash 0.55s ease-out;
        }

        .milestone-flash.level-2.show {
            animation:
                milestoneFlashStrong 0.65s ease-out;
        }

        .milestone-flash.level-3.show {
            animation:
                milestoneFlashVeryStrong 0.8s ease-out;
        }

        @keyframes milestoneFlash {

            0% {
                opacity: 0;
                transform: scale(0.7);
            }

            30% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1.3);
            }

        }

        @keyframes milestoneFlashStrong {

            0% {
                opacity: 0;
                transform: scale(0.6);
            }

            25% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1.4);
            }

        }

        @keyframes milestoneFlashVeryStrong {

            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            20% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1.5);
            }

        }


        /* =====================================================
           RED FLASH
        ===================================================== */

        .red-flash {
            position: fixed;
            inset: 0;

            pointer-events: none;

            z-index: 19;

            opacity: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 50, 50, 0.18),
                    rgba(255, 0, 0, 0.05) 45%,
                    transparent 70%
                );
        }

        .red-flash.show {
            animation: redFlash 0.45s ease-out;
        }

        @keyframes redFlash {

            0% {
                opacity: 0;
            }

            25% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }

        }


        /* =====================================================
           GAME OVER
        ===================================================== */

        .game-over-content {
            width: 90%;
            max-width: 420px;
        }

        .game-over-title {
            font-size: clamp(38px, 11vw, 68px);
            font-weight: 900;
            color: white;
            letter-spacing: -2px;
        }

        .final-label {
            margin-top: 30px;
            color: #777;
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: 900;
        }

        .final-score {
            margin-top: 5px;
            font-size: clamp(65px, 18vw, 110px);
            line-height: 0.9;
            font-weight: 900;
            color: #fcc224;

            text-shadow:
                0 0 30px rgba(252, 194, 36, 0.25);
        }

        .new-best {
            margin-top: 15px;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fcc224;
            opacity: 0;
        }

        .new-best.show {
            opacity: 1;
        }


        /* =====================================================
           SMALL PHONES / SHORT SCREENS
        ===================================================== */

        @media (max-height: 600px) {

            .hud {
                height: 55px;
            }

            #playArea {
                top: 55px;
            }

            .combo {
                top: 54px;
            }

            .combo-lost {
                top: 80px;
            }

            .streak-message {
                bottom: 35px;
            }

            .start-button,
            .play-again-button {
                margin-top: 25px;
                padding: 14px 18px;
            }

        }


        /* =====================================================
           LANDSCAPE
        ===================================================== */

        @media (orientation: landscape) and (max-height: 500px) {

            .logo {
                font-size: 42px;
            }

            .tagline {
                margin-top: 10px;
            }

            .best-label {
                margin-top: 15px;
            }

            .start-button {
                margin-top: 15px;
            }

            .game-over-title {
                font-size: 42px;
            }

            .final-label {
                margin-top: 12px;
            }

            .final-score {
                font-size: 65px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         START SCREEN
    ===================================================== -->

    <div
        id="startScreen"
        class="screen"
    >

        <div class="start-content">

            <div class="logo">
                ONE
                <span>WRONG TAP</span>
            </div>

            <div class="tagline">
                One wrong tap and it's over.
            </div>

            <div class="best-label">
                BEST
            </div>

            <div
                id="bestScore"
                class="best-score"
            >
                0
            </div>

            <button
                id="startButton"
                class="start-button"
                type="button"
            >
                START GAME
            </button>

        </div>

    </div>


    <!-- =====================================================
         GAME SCREEN
    ===================================================== -->

    <div
        id="gameScreen"
        class="hidden"
    >

        <!-- HUD -->

        <div class="hud">

            <div class="hud-item">

                <div class="hud-label">
                    TIME
                </div>

                <div
                    id="time"
                    class="hud-value"
                >
                    30
                </div>

            </div>


            <div class="hud-item">

                <div class="hud-label">
                    SCORE
                </div>

                <div
                    id="score"
                    class="hud-value"
                >
                    0
                </div>

            </div>


            <div class="hud-item">

                <div class="hud-label">
                    STREAK
                </div>

                <div
                    id="streak"
                    class="hud-value"
                >
                    0
                </div>

            </div>

        </div>


        <!-- COMBO -->

        <div
            id="combo"
            class="combo"
        >
            COMBO x1
        </div>


        <!-- COMBO LOST -->

        <div
            id="comboLost"
            class="combo-lost"
        >
            COMBO LOST!
        </div>


        <!-- PLAY AREA -->

        <div id="playArea"></div>


        <!-- COUNTDOWN -->

        <div
            id="countdown"
            class="countdown"
        >
            3
        </div>


        <!-- STREAK MESSAGE -->

        <div
            id="streakMessage"
            class="streak-message"
        >
            NICE STREAK!
        </div>


        <!-- SCORE POP -->

        <div
            id="scorePop"
            class="score-pop"
        >
            +1
        </div>


        <!-- MILESTONE FLASH -->

        <div
            id="milestoneFlash"
            class="milestone-flash"
        ></div>


        <!-- RED FLASH -->

        <div
            id="redFlash"
            class="red-flash"
        ></div>

    </div>


    <!-- =====================================================
         GAME OVER SCREEN
    ===================================================== -->

    <div
        id="gameOverScreen"
        class="screen hidden"
    >

        <div class="game-over-content">

            <div class="game-over-title">
                GAME OVER
            </div>

            <div class="final-label">
                FINAL SCORE
            </div>

            <div
                id="finalScore"
                class="final-score"
            >
                0
            </div>

            <div
                id="newBest"
                class="new-best"
            >
                NEW BEST!
            </div>

            <div class="best-label">
                BEST
            </div>

            <div
                id="gameOverBest"
                class="best-score"
            >
                0
            </div>

            <button
                id="playAgainButton"
                class="play-again-button"
                type="button"
            >
                PLAY AGAIN
            </button>

        </div>

    </div>


    <script>

        /* =====================================================
           ELEMENTS
        ===================================================== */

        const startScreen =
            document.getElementById(
                "startScreen"
            );

        const gameScreen =
            document.getElementById(
                "gameScreen"
            );

        const gameOverScreen =
            document.getElementById(
                "gameOverScreen"
            );

        const startButton =
            document.getElementById(
                "startButton"
            );

        const playAgainButton =
            document.getElementById(
                "playAgainButton"
            );

        const playArea =
            document.getElementById(
                "playArea"
            );

        const timeDisplay =
            document.getElementById(
                "time"
            );

        const scoreDisplay =
            document.getElementById(
                "score"
            );

        const streakDisplay =
            document.getElementById(
                "streak"
            );

        const bestScoreDisplay =
            document.getElementById(
                "bestScore"
            );

        const finalScoreDisplay =
            document.getElementById(
                "finalScore"
            );

        const gameOverBestDisplay =
            document.getElementById(
                "gameOverBest"
            );

        const newBestDisplay =
            document.getElementById(
                "newBest"
            );

        const countdown =
            document.getElementById(
                "countdown"
            );

        const streakMessage =
            document.getElementById(
                "streakMessage"
            );

        const scorePop =
            document.getElementById(
                "scorePop"
            );

        const combo =
            document.getElementById(
                "combo"
            );

        const comboLost =
            document.getElementById(
                "comboLost"
            );

        const milestoneFlash =
            document.getElementById(
                "milestoneFlash"
            );

        const redFlash =
            document.getElementById(
                "redFlash"
            );


        /* =====================================================
           GAME STATE
        ===================================================== */

        let score = 0;

        let streak = 0;

        let timeLeft = 30;

        let timer = null;

        let gameRunning = false;

        let targets = [];

        let highScore =
            Number(
                localStorage.getItem(
                    "oneWrongTapHighScore"
                )
            ) || 0;


        /* =====================================================
           AUDIO
        ===================================================== */

        let audioContext = null;


        function initAudio() {

            if (!audioContext) {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                if (AudioContext) {

                    audioContext =
                        new AudioContext();

                }

            }

            if (
                audioContext &&
                audioContext.state === "suspended"
            ) {

                audioContext.resume();

            }

        }


        function playTone(
            frequency,
            duration,
            type = "sine",
            volume = 0.045,
            delay = 0
        ) {

            if (!audioContext) {
                return;
            }

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();

            oscillator.type = type;

            oscillator.frequency.value =
                frequency;

            gain.gain.setValueAtTime(
                0,
                audioContext.currentTime + delay
            );

            gain.gain.linearRampToValueAtTime(
                volume,
                audioContext.currentTime +
                    delay +
                    0.01
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audioContext.currentTime +
                    delay +
                    duration
            );

            oscillator.connect(gain);

            gain.connect(
                audioContext.destination
            );

            oscillator.start(
                audioContext.currentTime +
                    delay
            );

            oscillator.stop(
                audioContext.currentTime +
                    delay +
                    duration +
                    0.02
            );

        }


        function correctSound() {

            playTone(
                900,
                0.07,
                "sine",
                0.035
            );

        }


        function streakSound() {

            playTone(
                700,
                0.10,
                "sine",
                0.035,
                0
            );

            playTone(
                950,
                0.10,
                "sine",
                0.035,
                0.08
            );

            playTone(
                1250,
                0.14,
                "sine",
                0.04,
                0.16
            );

        }


        function wrongSound() {

            playTone(
                180,
                0.22,
                "sawtooth",
                0.055
            );

            playTone(
                100,
                0.30,
                "sawtooth",
                0.045,
                0.10
            );

        }


        function countdownSound(
            number
        ) {

            if (number === 1) {

                playTone(
                    700,
                    0.12,
                    "sine",
                    0.04
                );

            } else {

                playTone(
                    500,
                    0.10,
                    "sine",
                    0.035
                );

            }

        }


        function goSound() {

            playTone(
                650,
                0.08,
                "sine",
                0.035,
                0
            );

            playTone(
                1000,
                0.14,
                "sine",
                0.045,
                0.08
            );

        }


        function milestoneSound(
            level
        ) {

            playTone(
                880,
                0.12,
                "sine",
                0.035,
                0
            );

            playTone(
                1100,
                0.12,
                "sine",
                0.04,
                0.10
            );

            if (level >= 2) {

                playTone(
                    1320,
                    0.14,
                    "sine",
                    0.045,
                    0.20
                );

            }

            if (level >= 3) {

                playTone(
                    1760,
                    0.18,
                    "sine",
                    0.05,
                    0.32
                );

            }

        }


        function tickSound() {

            playTone(
                800,
                0.035,
                "sine",
                0.018
            );

        }


        function scoreMilestoneSound(
            milestone
        ) {

            if (milestone === 10) {

                playTone(
                    900,
                    0.10,
                    "sine",
                    0.035
                );

            }

            if (milestone === 20) {

                playTone(
                    900,
                    0.10,
                    "sine",
                    0.035
                );

                playTone(
                    1200,
                    0.12,
                    "sine",
                    0.04,
                    0.10
                );

            }

            if (milestone === 30) {

                playTone(
                    900,
                    0.10,
                    "sine",
                    0.035
                );

                playTone(
                    1200,
                    0.10,
                    "sine",
                    0.04,
                    0.10
                );

                playTone(
                    1500,
                    0.14,
                    "sine",
                    0.045,
                    0.20
                );

            }

            if (milestone === 50) {

                playTone(
                    900,
                    0.10,
                    "sine",
                    0.04
                );

                playTone(
                    1200,
                    0.10,
                    "sine",
                    0.04,
                    0.10
                );

                playTone(
                    1500,
                    0.10,
                    "sine",
                    0.045,
                    0.20
                );

                playTone(
                    1900,
                    0.18,
                    "sine",
                    0.05,
                    0.30
                );

            }

        }


        /* =====================================================
           VIBRATION
        ===================================================== */

        function vibrate(
            pattern
        ) {

            if (
                "vibrate" in navigator
            ) {

                navigator.vibrate(
                    pattern
                );

            }

        }


        /* =====================================================
           HUD
        ===================================================== */

        function updateHUD() {

            timeDisplay.textContent =
                timeLeft;

            scoreDisplay.textContent =
                score;

            streakDisplay.textContent =
                streak;

        }


        /* =====================================================
           COMBO
        ===================================================== */

        function getComboLevel() {

            if (streak >= 20) {
                return 5;
            }

            if (streak >= 15) {
                return 4;
            }

            if (streak >= 10) {
                return 3;
            }

            if (streak >= 5) {
                return 2;
            }

            return 1;

        }


        function updateCombo(
            animate = false
        ) {

            const level =
                getComboLevel();

            combo.textContent =
                "COMBO x" + level;

            if (streak >= 5) {

                combo.classList.add(
                    "active"
                );

            } else {

                combo.classList.remove(
                    "active"
                );

            }

            if (animate) {

                combo.classList.remove(
                    "bump"
                );

                void combo.offsetWidth;

                combo.classList.add(
                    "bump"
                );

            }

        }


        function showComboLost() {

            comboLost.classList.remove(
                "show"
            );

            void comboLost.offsetWidth;

            comboLost.classList.add(
                "show"
            );

        }


        /* =====================================================
           STREAK
        ===================================================== */

        function getStreakClass() {

            if (streak >= 20) {

                return "streak-extreme";

            }

            if (streak >= 10) {

                return "streak-high";

            }

            if (streak >= 5) {

                return "streak-medium";

            }

            return "streak-low";

        }


        const streakMilestones = [
            5,
            10,
            15,
            20,
            25,
            30,
            40,
            50
        ];


        function checkStreakMilestone() {

            if (
                streakMilestones.includes(
                    streak
                )
            ) {

                streakMessage.textContent =
                    streak +
                    " STREAK!";

                streakMessage.classList.remove(
                    "show"
                );

                void streakMessage.offsetWidth;

                streakMessage.classList.add(
                    "show"
                );

                streakSound();

                vibrate([
                    18,
                    25,
                    18
                ]);

            }

        }


        /* =====================================================
           DIFFICULTY
        ===================================================== */

        function getDifficulty() {

            if (score < 5) {

                return {
                    count: 2,
                    size: 100
                };

            }

            if (score < 10) {

                return {
                    count: 3,
                    size: 95
                };

            }

            if (score < 20) {

                return {
                    count: 4,
                    size: 90
                };

            }

            if (score < 35) {

                return {
                    count: 5,
                    size: 85
                };

            }

            return {
                count: 6,
                size: 80
            };

        }


        function getRoundDelay() {

            if (score < 5) {
                return 120;
            }

            if (score < 10) {
                return 110;
            }

            if (score < 20) {
                return 100;
            }

            if (score < 35) {
                return 90;
            }

            if (score < 50) {
                return 80;
            }

            return 70;

        }


        /* =====================================================
           SCORE MILESTONES
        ===================================================== */

        function getMilestoneLevel(
            milestone
        ) {

            if (milestone >= 50) {
                return 3;
            }

            if (milestone >= 30) {
                return 2;
            }

            return 1;

        }


        function checkScoreMilestone() {

            const milestones = [
                10,
                20,
                30,
                50
            ];

            if (
                !milestones.includes(
                    score
                )
            ) {

                return;

            }

            const level =
                getMilestoneLevel(
                    score
                );

            milestoneFlash.classList.remove(
                "show",
                "level-2",
                "level-3"
            );

            if (level === 2) {

                milestoneFlash.classList.add(
                    "level-2"
                );

            }

            if (level === 3) {

                milestoneFlash.classList.add(
                    "level-3"
                );

            }

            void milestoneFlash.offsetWidth;

            milestoneFlash.classList.add(
                "show"
            );

            milestoneSound(
                level
            );

            scoreMilestoneSound(
                score
            );

            if (level === 1) {

                vibrate([
                    20,
                    25,
                    20
                ]);

            }

            if (level === 2) {

                vibrate([
                    25,
                    25,
                    35
                ]);

            }

            if (level === 3) {

                vibrate([
                    30,
                    25,
                    40,
                    25,
                    55
                ]);

            }

        }


        /* =====================================================
           TARGET POSITIONING
        ===================================================== */

        function circlesOverlap(
            a,
            b,
            gap
        ) {

            const dx =
                a.x - b.x;

            const dy =
                a.y - b.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            const minDistance =
                a.size / 2 +
                b.size / 2 +
                gap;

            return (
                distance <
                minDistance
            );

        }


        function shuffle(
            array
        ) {

            for (
                let i = array.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );

                [
                    array[i],
                    array[j]
                ] = [
                    array[j],
                    array[i]
                ];

            }

            return array;

        }


        function positionTargetsWithoutOverlap(
            targetElements
        ) {

            const areaWidth =
                playArea.clientWidth;

            const areaHeight =
                playArea.clientHeight;

            const positions = [];

            const zones = [];

            const rows = 3;
            const cols = 3;

            for (
                let row = 0;
                row < rows;
                row++
            ) {

                for (
                    let col = 0;
                    col < cols;
                    col++
                ) {

                    zones.push({
                        row,
                        col
                    });

                }

            }

            shuffle(zones);


            targetElements.forEach(
                target => {

                    const size =
                        target.offsetWidth;

                    const half =
                        size / 2;

                    let placed = false;

                    for (
                        let attempt = 0;
                        attempt < 100;
                        attempt++
                    ) {

                        let x;
                        let y;

                        if (
                            attempt < 30 &&
                            zones.length
                        ) {

                            const zone =
                                zones[
                                    attempt %
                                    zones.length
                                ];

                            const zoneWidth =
                                areaWidth /
                                cols;

                            const zoneHeight =
                                areaHeight /
                                rows;

                            x =
                                zone.col *
                                zoneWidth +
                                zoneWidth *
                                (
                                    0.25 +
                                    Math.random() *
                                    0.5
                                );

                            y =
                                zone.row *
                                zoneHeight +
                                zoneHeight *
                                (
                                    0.25 +
                                    Math.random() *
                                    0.5
                                );

                        } else {

                            x =
                                half +
                                Math.random() *
                                (
                                    areaWidth -
                                    size
                                );

                            y =
                                half +
                                Math.random() *
                                (
                                    areaHeight -
                                    size
                                );

                        }

                        x =
                            Math.max(
                                half,
                                Math.min(
                                    areaWidth -
                                    half,
                                    x
                                )
                            );

                        y =
                            Math.max(
                                half,
                                Math.min(
                                    areaHeight -
                                    half,
                                    y
                                )
                            );

                        const candidate = {
                            x,
                            y,
                            size
                        };

                        let overlaps =
                            false;

                        for (
                            const existing
                            of positions
                        ) {

                            if (
                                circlesOverlap(
                                    candidate,
                                    existing,
                                    14
                                )
                            ) {

                                overlaps = true;
                                break;

                            }

                        }

                        if (!overlaps) {

                            positions.push(
                                candidate
                            );

                            target.style.left =
                                (
                                    x -
                                    half
                                ) + "px";

                            target.style.top =
                                (
                                    y -
                                    half
                                ) + "px";

                            placed = true;

                            break;

                        }

                    }


                    if (!placed) {

                        const index =
                            positions.length;

                        const columns =
                            Math.max(
                                1,
                                Math.ceil(
                                    Math.sqrt(
                                        targetElements.length
                                    )
                                )
                            );

                        const rowsNeeded =
                            Math.ceil(
                                targetElements.length /
                                columns
                            );

                        const cellWidth =
                            areaWidth /
                            columns;

                        const cellHeight =
                            areaHeight /
                            rowsNeeded;

                        const col =
                            index %
                            columns;

                        const row =
                            Math.floor(
                                index /
                                columns
                            );

                        const x =
                            col *
                            cellWidth +
                            cellWidth / 2;

                        const y =
                            row *
                            cellHeight +
                            cellHeight / 2;

                        target.style.left =
                            (
                                x -
                                half
                            ) + "px";

                        target.style.top =
                            (
                                y -
                                half
                            ) + "px";

                        positions.push({
                            x,
                            y,
                            size
                        });

                    }

                }
            );

        }


        /* =====================================================
           CREATE ROUND
        ===================================================== */

        function createRound() {

            playArea.innerHTML = "";

            targets = [];

            const difficulty =
                getDifficulty();

            const correctIndex =
                Math.floor(
                    Math.random() *
                    difficulty.count
                );


            for (
                let i = 0;
                i < difficulty.count;
                i++
            ) {

                const target =
                    document.createElement(
                        "div"
                    );

                target.className =
                    "target";

                target.style.width =
                    difficulty.size +
                    "px";

                target.style.height =
                    difficulty.size +
                    "px";

                target.textContent =
                    "TAP";


                if (
                    i === correctIndex
                ) {

                    target.classList.add(
                        "correct"
                    );

                    target.classList.add(
                        getStreakClass()
                    );

                    target.dataset.correct =
                        "true";

               } else {

    target.classList.add(
        "wrong"
    );

    target.dataset.correct =
        "false";

    if (
        Math.random() < 0.35
    ) {

        target.classList.add(
            "deceptive"
        );

    }

}


                target.addEventListener(
                    "pointerdown",
                    handleTargetTap,
                    {
                        passive: false
                    }
                );


                playArea.appendChild(
                    target
                );

                targets.push(
                    target
                );

            }


            positionTargetsWithoutOverlap(
                targets
            );

        }


        /* =====================================================
           HANDLE TARGET TAP
        ===================================================== */

        function handleTargetTap(
            event
        ) {

            event.preventDefault();

            if (!gameRunning) {
                return;
            }

            const target =
                event.currentTarget;

            if (
                target.classList.contains(
                    "tapped"
                )
            ) {

                return;

            }


            if (
                target.dataset.correct ===
                "true"
            ) {

                target.classList.add(
                    "tapped"
                );

                correctSound();

                vibrate(8);

                const previousCombo =
                    getComboLevel();

                score++;

                streak++;

                updateHUD();

                const newCombo =
                    getComboLevel();

                updateCombo(
                    newCombo >
                    previousCombo
                );

                checkStreakMilestone();

                checkScoreMilestone();


                scorePop.classList.remove(
                    "show"
                );

                void scorePop.offsetWidth;

                scorePop.classList.add(
                    "show"
                );


                setTimeout(
                    () => {

                        if (gameRunning) {

                            createRound();

                        }

                    },
                    getRoundDelay()
                );


            } else {

                const comboWasActive =
                    streak >= 5;

                streak = 0;

                updateHUD();

                updateCombo();

                if (comboWasActive) {

                    showComboLost();

                }

                wrongSound();

                vibrate([
                    70,
                    35,
                    100
                ]);

                redFlash.classList.remove(
                    "show"
                );

                void redFlash.offsetWidth;

                redFlash.classList.add(
                    "show"
                );

                endGame();

            }

        }


        /* =====================================================
           COUNTDOWN
        ===================================================== */

        function startCountdown(
            callback
        ) {

            let number = 3;

            countdown.textContent =
                number;

            countdown.classList.remove(
                "show"
            );

            void countdown.offsetWidth;

            countdown.classList.add(
                "show"
            );

            countdownSound(
                number
            );

            vibrate(12);


            const countdownTimer =
                setInterval(
                    () => {

                        number--;

                        if (
                            number > 0
                        ) {

                            countdown.textContent =
                                number;

                            countdown.classList.remove(
                                "show"
                            );

                            void countdown.offsetWidth;

                            countdown.classList.add(
                                "show"
                            );

                            countdownSound(
                                number
                            );

                            vibrate(12);

                        } else {

                            clearInterval(
                                countdownTimer
                            );

                            countdown.textContent =
                                "GO";

                            countdown.classList.remove(
                                "show"
                            );

                            void countdown.offsetWidth;

                            countdown.classList.add(
                                "show"
                            );

                            goSound();

                            vibrate([
                                25,
                                20,
                                35
                            ]);

                            setTimeout(
                                callback,
                                350
                            );

                        }

                    },
                    800
                );

        }


        /* =====================================================
           START GAME
        ===================================================== */

        function startGame() {

            initAudio();

            clearInterval(
                timer
            );

            score = 0;

            streak = 0;

            timeLeft = 30;

            gameRunning = false;

            targets = [];

            playArea.innerHTML = "";

            updateHUD();

            updateCombo();

            comboLost.classList.remove(
                "show"
            );

            milestoneFlash.classList.remove(
                "show",
                "level-2",
                "level-3"
            );

            startScreen.classList.add(
                "hidden"
            );

            gameOverScreen.classList.add(
                "hidden"
            );

            gameScreen.classList.remove(
                "hidden"
            );


            startCountdown(
                () => {

                    gameRunning = true;

                    createRound();

                    startTimer();

                }
            );

        }


        /* =====================================================
           TIMER
        ===================================================== */

        function startTimer() {

            clearInterval(
                timer
            );

            timer =
                setInterval(
                    () => {

                        if (
                            !gameRunning
                        ) {

                            return;

                        }

                        timeLeft--;

                        updateHUD();


                        if (
                            timeLeft <= 5 &&
                            timeLeft > 0
                        ) {

                            tickSound();

                        }


                        if (
                            timeLeft <= 0
                        ) {

                            endGame();

                        }

                    },
                    1000
                );

        }


        /* =====================================================
           END GAME
        ===================================================== */

        function endGame() {

            if (
                !gameRunning
            ) {

                return;

            }

            gameRunning = false;

            clearInterval(
                timer
            );

            timer = null;

            targets = [];

            playArea.innerHTML = "";

            const isNewBest =
                score > highScore;

            if (isNewBest) {

                highScore =
                    score;

                localStorage.setItem(
                    "oneWrongTapHighScore",
                    highScore
                );

            }


            finalScoreDisplay.textContent =
                score;

            gameOverBestDisplay.textContent =
                highScore;

            newBestDisplay.classList.toggle(
                "show",
                isNewBest
            );

            bestScoreDisplay.textContent =
                highScore;


            setTimeout(
                () => {

                    gameScreen.classList.add(
                        "hidden"
                    );

                    gameOverScreen.classList.remove(
                        "hidden"
                    );

                },
                400
            );

        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        startButton.addEventListener(
            "click",
            startGame
        );

        playAgainButton.addEventListener(
            "click",
            startGame
        );


        /* =====================================================
           INITIAL BEST SCORE
        ===================================================== */

        bestScoreDisplay.textContent =
            highScore;

        gameOverBestDisplay.textContent =
            highScore;


        /* =====================================================
           RESIZE
        ===================================================== */

        window.addEventListener(
            "resize",
            () => {

                if (
                    gameRunning &&
                    targets.length
                ) {

                    positionTargetsWithoutOverlap(
                        targets
                    );

                }

            }
        );


        /* =====================================================
           MOBILE PROTECTION
        ===================================================== */

        document.addEventListener(
            "contextmenu",
            event => {
                event.preventDefault();
            }
        );

        document.addEventListener(
            "gesturestart",
            event => {
                event.preventDefault();
            }
        );

        document.addEventListener(
            "touchmove",
            event => {
                event.preventDefault();
            },
            {
                passive: false
            }
        );


    </script>

</body>
