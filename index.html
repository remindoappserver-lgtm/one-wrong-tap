<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ONE WRONG TAP</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at center, #222 0%, #111 45%, #050505 100%);
    color: white;
    touch-action: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 100%;
    height: 100%;
    max-width: 900px;
    position: relative;
    overflow: hidden;
}

/* =====================================================
   START / GAME OVER SCREEN
===================================================== */

.screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
    background:
        radial-gradient(circle at center, #202020 0%, #101010 50%, #050505 100%);
    z-index: 20;
}

.screen.hidden {
    display: none;
}

.logo {
    font-size: clamp(42px, 11vw, 82px);
    font-weight: 900;
    line-height: 0.88;
    letter-spacing: -3px;
}

.logo .yellow {
    color: #fcc224;
}

.tagline {
    margin-top: 18px;
    font-size: clamp(14px, 3.5vw, 20px);
    color: #aaa;
    letter-spacing: 1px;
}

.best-label {
    margin-top: 35px;
    font-size: 13px;
    color: #777;
    letter-spacing: 2px;
}

.best-score {
    margin-top: 4px;
    font-size: 30px;
    font-weight: bold;
    color: #fcc224;
}

.start-button {
    margin-top: 35px;
    width: min(300px, 80vw);
    height: 60px;
    border: none;
    border-radius: 14px;
    background: #fcc224;
    color: #111;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(252, 194, 36, 0.25);
}

.start-button:active {
    transform: scale(0.96);
}

/* =====================================================
   HUD
===================================================== */

.hud {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 85px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    align-items: center;
    padding: 8px 18px;
    z-index: 5;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.65),
        rgba(0,0,0,0)
    );
}

.hud-item {
    text-align: center;
}

.hud-label {
    font-size: 10px;
    color: #777;
    letter-spacing: 2px;
}

.hud-value {
    margin-top: 2px;
    font-size: 25px;
    font-weight: 900;
}

#timeValue {
    color: #fcc224;
}

#streakValue {
    color: #fcc224;
}

/* =====================================================
   COMBO INDICATOR
===================================================== */

.combo {
    position: absolute;
    top: 72px;
    left: 50%;

    transform:
        translateX(-50%)
        scale(0.85);

    padding: 5px 12px;

    border: 1px solid rgba(252, 194, 36, 0.35);
    border-radius: 20px;

    background: rgba(252, 194, 36, 0.08);

    color: #fcc224;

    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;

    opacity: 0;

    pointer-events: none;

    z-index: 9;

    transition:
        opacity 0.2s ease,
        transform 0.2s ease;
}

.combo.active {
    opacity: 1;

    transform:
        translateX(-50%)
        scale(1);
}

.combo.bump {
    animation:
        comboBump 0.35s ease-out;
}

@keyframes comboBump {

    0% {
        transform:
            translateX(-50%)
            scale(1);
    }

    45% {
        transform:
            translateX(-50%)
            scale(1.18);
    }

    100% {
        transform:
            translateX(-50%)
            scale(1);
    }

}

/* =====================================================
   PLAY AREA
===================================================== */

.play-area {
    position: absolute;
    top: 85px;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
}

/* =====================================================
   TARGET
===================================================== */

.target {
    position: absolute;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;
    border: none;

    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1px;

    cursor: pointer;
    user-select: none;

    transition:
        transform 0.08s ease,
        opacity 0.12s ease,
        box-shadow 0.2s ease;

    touch-action: none;

    animation:
        targetAppear 0.18s ease-out,
        targetFloat 2.8s ease-in-out infinite;

    will-change: transform;
}

.target.correct {
    background: #fcc224;
    color: #111;

    animation:
        targetAppear 0.18s ease-out,
        targetFloat 2.8s ease-in-out infinite,
        correctPulse 1.8s ease-in-out infinite;

    box-shadow:
        0 0 20px rgba(252, 194, 36, 0.30);
}

.target.wrong {
    background: #f4f4f4;
    color: #111;
}

/* =====================================================
   DECEPTIVE WRONG TARGET
===================================================== */

.target.wrong.deceptive {
    animation:
        targetAppear 0.18s ease-out,
        targetFloat 2.8s ease-in-out infinite,
        deceptiveGlow 0.8s ease-out 0.05s 1;
}

@keyframes deceptiveGlow {

    0% {
        box-shadow:
            0 0 0 rgba(252, 194, 36, 0);
    }

    30% {
        box-shadow:
            0 0 18px rgba(252, 194, 36, 0.16);
    }

    100% {
        box-shadow:
            0 0 0 rgba(252, 194, 36, 0);
    }

}

.target:active {
    transform: scale(0.94);
}

/* =====================================================
   TARGET ANIMATIONS
===================================================== */

@keyframes targetAppear {

    from {
        opacity: 0;
        transform: scale(0.65);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

@keyframes targetFloat {

    0% {
        margin-top: 0;
        margin-left: 0;
    }

    25% {
        margin-top: -5px;
        margin-left: 4px;
    }

    50% {
        margin-top: 2px;
        margin-left: -4px;
    }

    75% {
        margin-top: 5px;
        margin-left: 3px;
    }

    100% {
        margin-top: 0;
        margin-left: 0;
    }

}

@keyframes correctPulse {

    0% {
        box-shadow:
            0 0 20px rgba(252, 194, 36, 0.30);
    }

    50% {
        box-shadow:
            0 0 38px rgba(252, 194, 36, 0.48);
    }

    100% {
        box-shadow:
            0 0 20px rgba(252, 194, 36, 0.30);
    }

}

/* =====================================================
   STREAK INTENSITY
===================================================== */

.target.correct.streak-low {
    box-shadow:
        0 0 24px rgba(252, 194, 36, 0.34);
}

.target.correct.streak-medium {
    box-shadow:
        0 0 30px rgba(252, 194, 36, 0.40);
}

.target.correct.streak-high {
    box-shadow:
        0 0 40px rgba(252, 194, 36, 0.52);
}

.target.correct.streak-extreme {
    box-shadow:
        0 0 52px rgba(252, 194, 36, 0.68);
}

/* =====================================================
   TAP FEEDBACK
===================================================== */

.target.tapped {
    animation:
        targetTap 0.13s ease-out forwards !important;
}

@keyframes targetTap {

    0% {
        transform: scale(1);
        opacity: 1;
    }

    55% {
        transform: scale(0.72);
        opacity: 0.9;
    }

    100% {
        transform: scale(1.12);
        opacity: 0;
    }

}

/* =====================================================
   COUNTDOWN
===================================================== */

.countdown {
    position: absolute;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: clamp(80px, 25vw, 180px);
    font-weight: 900;

    color: #fcc224;

    z-index: 15;

    pointer-events: none;

    text-shadow:
        0 0 40px rgba(252, 194, 36, 0.35);
}

.countdown.hidden {
    display: none;
}

.countdown.pop {
    animation:
        countdownPop 0.55s ease-out;
}

@keyframes countdownPop {

    0% {
        transform: scale(0.5);
        opacity: 0;
    }

    40% {
        transform: scale(1.15);
        opacity: 1;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }

}

/* =====================================================
   STREAK MESSAGE
===================================================== */

.streak-message {
    position: absolute;

    top: 105px;
    left: 50%;

    transform:
        translateX(-50%);

    color: #fcc224;

    font-size: 16px;
    font-weight: 900;

    letter-spacing: 2px;

    pointer-events: none;

    z-index: 10;

    opacity: 0;
}

.streak-message.show {
    animation:
        streakPop 0.75s ease-out;
}

@keyframes streakPop {

    0% {
        opacity: 0;

        transform:
            translateX(-50%)
            scale(0.6);
    }

    25% {
        opacity: 1;

        transform:
            translateX(-50%)
            scale(1.15);
    }

    100% {
        opacity: 0;

        transform:
            translateX(-50%)
            scale(1);
    }

}

/* =====================================================
   RED FLASH
===================================================== */

.red-flash {
    position: absolute;
    inset: 0;

    background:
        rgba(255, 0, 0, 0.18);

    opacity: 0;

    pointer-events: none;

    z-index: 12;
}

.red-flash.show {
    animation:
        redFlash 0.35s ease-out;
}

@keyframes redFlash {

    0% {
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }

}

/* =====================================================
   SCORE POP
===================================================== */

.score-pop {
    position: absolute;

    left: 50%;
    top: 95px;

    transform:
        translateX(-50%);

    font-size: 22px;
    font-weight: 900;

    color: #fcc224;

    pointer-events: none;

    z-index: 10;

    opacity: 0;
}

.score-pop.show {
    animation:
        scorePop 0.45s ease-out;
}

@keyframes scorePop {

    0% {
        opacity: 0;

        transform:
            translate(-50%, 10px)
            scale(0.7);
    }

    35% {
        opacity: 1;

        transform:
            translate(-50%, 0)
            scale(1.15);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -28px)
            scale(1);
    }

}

/* =====================================================
   MILESTONE EFFECT
===================================================== */

.milestone-flash {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(252, 194, 36, 0.30),
            rgba(252, 194, 36, 0.08) 35%,
            rgba(252, 194, 36, 0) 70%
        );

    opacity: 0;

    pointer-events: none;

    z-index: 11;
}

.milestone-flash.show {
    animation:
        milestoneFlash 0.55s ease-out;
}

.milestone-flash.level-2.show {
    animation:
        milestoneFlashStrong 0.65s ease-out;
}

.milestone-flash.level-3.show {
    animation:
        milestoneFlashVeryStrong 0.8s ease-out;
}

@keyframes milestoneFlash {

    0% {
        opacity: 0;
    }

    25% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }

}

@keyframes milestoneFlashStrong {

    0% {
        opacity: 0;
        transform: scale(0.96);
    }

    25% {
        opacity: 1;
        transform: scale(1);
    }

    100% {
        opacity: 0;
        transform: scale(1.04);
    }

}

@keyframes milestoneFlashVeryStrong {

    0% {
        opacity: 0;
        transform: scale(0.92);
    }

    25% {
        opacity: 1;
        transform: scale(1);
    }

    100% {
        opacity: 0;
        transform: scale(1.08);
    }

}

/* =====================================================
   MILESTONE LABEL
===================================================== */

.milestone-label {
    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.65);

    text-align: center;

    color: #fcc224;

    font-weight: 900;

    pointer-events: none;

    z-index: 14;

    opacity: 0;

    text-shadow:
        0 0 25px rgba(252, 194, 36, 0.55),
        0 0 50px rgba(252, 194, 36, 0.25);
}

.milestone-label.show {
    animation:
        milestoneLabelPop 0.75s ease-out;
}

.milestone-label-title {
    font-size: clamp(22px, 6vw, 38px);
    letter-spacing: 4px;
}

.milestone-label-score {
    margin-top: 4px;
    font-size: clamp(55px, 15vw, 100px);
    line-height: 0.9;
    letter-spacing: -2px;
}

@keyframes milestoneLabelPop {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0.55);
    }

    25% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.15);
    }

    45% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(1.08);
    }

}

/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-height: 600px) {

    .hud {
        height: 65px;
    }

    .play-area {
        top: 65px;
    }

    .streak-message {
        top: 75px;
    }

    .score-pop {
        top: 65px;
    }

    .combo {
        top: 54px;
    }

}

@media (max-width: 380px) {

    .hud-value {
        font-size: 21px;
    }

    .hud-label {
        font-size: 9px;
    }

}

</style>
</head>

<body>

<div class="game">

    <div id="startScreen" class="screen">

        <div class="logo">
            <div>ONE</div>
            <div class="yellow">WRONG TAP</div>
        </div>

        <div class="tagline">
            One wrong tap and it's over.
        </div>

        <div class="best-label">
            BEST
        </div>

        <div id="startBest" class="best-score">
            0
        </div>

        <button
            id="startButton"
            class="start-button"
        >
            START GAME
        </button>

    </div>


    <div
        id="gameOverScreen"
        class="screen hidden"
    >

        <div class="logo">
            <div>GAME</div>
            <div class="yellow">OVER</div>
        </div>

        <div class="best-label">
            FINAL SCORE
        </div>

        <div
            id="finalScore"
            class="best-score"
        >
            0
        </div>

        <div
            id="newBest"
            style="
                margin-top:12px;
                color:#fcc224;
                font-weight:900;
                letter-spacing:2px;
                display:none;
            "
        >
            NEW BEST!
        </div>

        <div class="best-label">
            BEST
        </div>

        <div
            id="gameOverBest"
            class="best-score"
        >
            0
        </div>

        <button
            id="playAgainButton"
            class="start-button"
        >
            PLAY AGAIN
        </button>

    </div>


    <div class="hud">

        <div class="hud-item">

            <div class="hud-label">
                TIME
            </div>

            <div
                id="timeValue"
                class="hud-value"
            >
                30
            </div>

        </div>


        <div class="hud-item">

            <div class="hud-label">
                SCORE
            </div>

            <div
                id="scoreValue"
                class="hud-value"
            >
                0
            </div>

        </div>


        <div class="hud-item">

            <div class="hud-label">
                STREAK
            </div>

            <div
                id="streakValue"
                class="hud-value"
            >
                0
            </div>

        </div>

    </div>


    <div
        id="combo"
        class="combo"
    >
        COMBO x1
    </div>


    <div
        id="playArea"
        class="play-area"
    ></div>


    <div
        id="countdown"
        class="countdown hidden"
    >
        3
    </div>


    <div
        id="streakMessage"
        class="streak-message"
    >
        STREAK!
    </div>


    <div
        id="scorePop"
        class="score-pop"
    >
        +1
    </div>


    <div
        id="milestoneFlash"
        class="milestone-flash"
    ></div>


    <div
        id="milestoneLabel"
        class="milestone-label"
    >

        <div
            id="milestoneLabelTitle"
            class="milestone-label-title"
        >
            MILESTONE!
        </div>

        <div
            id="milestoneLabelScore"
            class="milestone-label-score"
        >
            10
        </div>

    </div>


    <div
        id="redFlash"
        class="red-flash"
    ></div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const gameOverScreen =
    document.getElementById(
        "gameOverScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const playAgainButton =
    document.getElementById(
        "playAgainButton"
    );

const playArea =
    document.getElementById(
        "playArea"
    );

const timeValue =
    document.getElementById(
        "timeValue"
    );

const scoreValue =
    document.getElementById(
        "scoreValue"
    );

const streakValue =
    document.getElementById(
        "streakValue"
    );

const startBest =
    document.getElementById(
        "startBest"
    );

const finalScore =
    document.getElementById(
        "finalScore"
    );

const gameOverBest =
    document.getElementById(
        "gameOverBest"
    );

const newBest =
    document.getElementById(
        "newBest"
    );

const countdown =
    document.getElementById(
        "countdown"
    );

const streakMessage =
    document.getElementById(
        "streakMessage"
    );

const redFlash =
    document.getElementById(
        "redFlash"
    );

const scorePop =
    document.getElementById(
        "scorePop"
    );

const combo =
    document.getElementById(
        "combo"
    );

const milestoneFlash =
    document.getElementById(
        "milestoneFlash"
    );

const milestoneLabel =
    document.getElementById(
        "milestoneLabel"
    );

const milestoneLabelScore =
    document.getElementById(
        "milestoneLabelScore"
    );


/* =====================================================
   GAME STATE
===================================================== */

let score = 0;

let streak = 0;

let timeLeft = 30;

let timer = null;

let gameRunning = false;

let targets = [];

let highScore =
    Number(
        localStorage.getItem(
            "oneWrongTapHighScore"
        )
    ) || 0;


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;


function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

}


/* =====================================================
   SOUND
===================================================== */

function playTone(
    frequency,
    duration,
    type = "sine",
    volume = 0.05
) {

    if (!audioContext)
        return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime +
        duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
        duration
    );

}


/* =====================================================
   CORRECT SOUND
===================================================== */

function correctSound() {

    playTone(
        720,
        0.08,
        "sine",
        0.045
    );

}


/* =====================================================
   STREAK SOUND
===================================================== */

function streakSound() {

    playTone(
        660,
        0.08,
        "sine",
        0.04
    );

    setTimeout(() => {

        playTone(
            880,
            0.08,
            "sine",
            0.04
        );

    }, 70);

    setTimeout(() => {

        playTone(
            1100,
            0.12,
            "sine",
            0.045
        );

    }, 140);

}


/* =====================================================
   WRONG SOUND
===================================================== */

function wrongSound() {

    playTone(
        120,
        0.25,
        "sawtooth",
        0.06
    );

}


/* =====================================================
   COUNTDOWN SOUND
===================================================== */

function countdownSound() {

    playTone(
        500,
        0.09,
        "sine",
        0.035
    );

}


/* =====================================================
   GO SOUND
===================================================== */

function goSound() {

    playTone(
        900,
        0.12,
        "sine",
        0.045
    );

    setTimeout(() => {

        playTone(
            1200,
            0.16,
            "sine",
            0.05
        );

    }, 90);

}


/* =====================================================
   MILESTONE SOUND
===================================================== */

function milestoneSound(
    level
) {

    if (level === 1) {

        playTone(
            880,
            0.08,
            "sine",
            0.035
        );

        setTimeout(() => {

            playTone(
                1100,
                0.12,
                "sine",
                0.04
            );

        }, 70);

        return;

    }


    if (level === 2) {

        playTone(
            880,
            0.08,
            "sine",
            0.04
        );

        setTimeout(() => {

            playTone(
                1100,
                0.08,
                "sine",
                0.04
            );

        }, 70);

        setTimeout(() => {

            playTone(
                1320,
                0.14,
                "sine",
                0.045
            );

        }, 140);

        return;

    }


    playTone(
        880,
        0.08,
        "sine",
        0.04
    );

    setTimeout(() => {

        playTone(
            1100,
            0.08,
            "sine",
            0.04
        );

    }, 70);

    setTimeout(() => {

        playTone(
            1320,
            0.08,
            "sine",
            0.045
        );

    }, 140);

    setTimeout(() => {

        playTone(
            1760,
            0.18,
            "sine",
            0.05
        );

    }, 210);

}


/* =====================================================
   HAPTICS
===================================================== */

function vibrate(pattern) {

    if (
        navigator.vibrate &&
        typeof navigator.vibrate ===
        "function"
    ) {

        navigator.vibrate(pattern);

    }

}


/* =====================================================
   UPDATE HUD
===================================================== */

function updateHUD() {

    timeValue.textContent =
        timeLeft;

    scoreValue.textContent =
        score;

    streakValue.textContent =
        streak;

}


/* =====================================================
   COMBO LEVEL
===================================================== */

function getComboLevel() {

    if (streak >= 20) {

        return 5;

    }

    if (streak >= 15) {

        return 4;

    }

    if (streak >= 10) {

        return 3;

    }

    if (streak >= 5) {

        return 2;

    }

    return 1;

}


/* =====================================================
   UPDATE COMBO
===================================================== */

function updateCombo(
    animate = false
) {

    const comboLevel =
        getComboLevel();


    if (streak < 5) {

        combo.classList.remove(
            "active"
        );

        return;

    }


    combo.textContent =
        `COMBO x${comboLevel}`;


    combo.classList.add(
        "active"
    );


    if (animate) {

        combo.classList.remove(
            "bump"
        );

        void combo.offsetWidth;

        combo.classList.add(
            "bump"
        );

    }

}


/* =====================================================
   STREAK INTENSITY
===================================================== */

function getStreakClass() {

    if (streak >= 20) {

        return "streak-extreme";

    }

    if (streak >= 10) {

        return "streak-high";

    }

    if (streak >= 5) {

        return "streak-medium";

    }

    return "streak-low";

}


/* =====================================================
   DIFFICULTY
===================================================== */

function getDifficulty() {

    if (score < 5) {

        return {
            count: 2,
            size: 100
        };

    }

    if (score < 10) {

        return {
            count: 3,
            size: 95
        };

    }

    if (score < 20) {

        return {
            count: 4,
            size: 90
        };

    }

    if (score < 35) {

        return {
            count: 5,
            size: 85
        };

    }

    return {
        count: 6,
        size: 80
    };

}


/* =====================================================
   SPEED
===================================================== */

function getRoundDelay() {

    if (score < 5) {

        return 120;

    }

    if (score < 10) {

        return 110;

    }

    if (score < 20) {

        return 100;

    }

    if (score < 35) {

        return 90;

    }

    if (score < 50) {

        return 80;

    }

    return 70;

}


/* =====================================================
   MILESTONE LEVEL
===================================================== */

function getMilestoneLevel(
    milestone
) {

    if (milestone >= 50) {

        return 3;

    }

    if (milestone >= 30) {

        return 2;

    }

    return 1;

}


/* =====================================================
   MILESTONE LABEL
===================================================== */

function showMilestoneLabel() {

    milestoneLabelScore.textContent =
        score;

    milestoneLabel.classList.remove(
        "show"
    );

    void milestoneLabel.offsetWidth;

    milestoneLabel.classList.add(
        "show"
    );

}


/* =====================================================
   SCORE MILESTONE
===================================================== */

function checkScoreMilestone() {

    const milestones = [
        10,
        20,
        30,
        50
    ];


    if (
        !milestones.includes(score)
    ) {

        return;

    }


    const level =
        getMilestoneLevel(score);


    milestoneFlash.classList.remove(
        "show",
        "level-2",
        "level-3"
    );


    if (level === 2) {

        milestoneFlash.classList.add(
            "level-2"
        );

    }

    if (level === 3) {

        milestoneFlash.classList.add(
            "level-3"
        );

    }


    void milestoneFlash.offsetWidth;


    milestoneFlash.classList.add(
        "show"
    );


    showMilestoneLabel();


    milestoneSound(level);


    if (level === 1) {

        vibrate([
            20,
            25,
            20
        ]);

    } else if (level === 2) {

        vibrate([
            25,
            25,
            35
        ]);

    } else {

        vibrate([
            30,
            25,
            40,
            25,
            55
        ]);

    }

}


/* =====================================================
   CIRCLE COLLISION
===================================================== */

function circlesOverlap(
    a,
    b,
    gap = 12
) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    return (
        distance <
        (
            a.radius +
            b.radius +
            gap
        )
    );

}


/* =====================================================
   POSITION TARGETS
===================================================== */

function positionTargetsWithoutOverlap(
    targetElements
) {

    const areaWidth =
        playArea.clientWidth;

    const areaHeight =
        playArea.clientHeight;

    const placed = [];


    const zones = [

        { col: 0, row: 0 },
        { col: 1, row: 0 },
        { col: 2, row: 0 },

        { col: 0, row: 1 },
        { col: 1, row: 1 },
        { col: 2, row: 1 },

        { col: 0, row: 2 },
        { col: 1, row: 2 },
        { col: 2, row: 2 }

    ];


    for (
        let i = zones.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            zones[i],
            zones[j]
        ] = [
            zones[j],
            zones[i]
        ];

    }


    targetElements.forEach(
        target => {

            const radius =
                target.offsetWidth / 2;

            let placedSuccessfully =
                false;


            for (
                const zone of zones
            ) {

                if (
                    placedSuccessfully
                ) {

                    break;

                }


                const zoneWidth =
                    areaWidth / 3;

                const zoneHeight =
                    areaHeight / 3;


                const zoneLeft =
                    zone.col *
                    zoneWidth;

                const zoneTop =
                    zone.row *
                    zoneHeight;


                const minX =
                    Math.max(
                        radius,
                        zoneLeft +
                        radius
                    );

                const maxX =
                    Math.min(
                        areaWidth -
                        radius,
                        zoneLeft +
                        zoneWidth -
                        radius
                    );


                const minY =
                    Math.max(
                        radius,
                        zoneTop +
                        radius
                    );

                const maxY =
                    Math.min(
                        areaHeight -
                        radius,
                        zoneTop +
                        zoneHeight -
                        radius
                    );


                for (
                    let attempt = 0;
                    attempt < 50;
                    attempt++
                ) {

                    const x =
                        minX +
                        Math.random() *
                        Math.max(
                            1,
                            maxX - minX
                        );

                    const y =
                        minY +
                        Math.random() *
                        Math.max(
                            1,
                            maxY - minY
                        );


                    const candidate = {
                        x,
                        y,
                        radius
                    };


                    let overlaps =
                        false;


                    for (
                        const other of placed
                    ) {

                        if (
                            circlesOverlap(
                                candidate,
                                other,
                                14
                            )
                        ) {

                            overlaps =
                                true;

                            break;

                        }

                    }


                    if (
                        !overlaps
                    ) {

                        target.style.left =
                            `${x - radius}px`;

                        target.style.top =
                            `${y - radius}px`;

                        placed.push(
                            candidate
                        );

                        placedSuccessfully =
                            true;

                        break;

                    }

                }

            }


            if (
                !placedSuccessfully
            ) {

                for (
                    let attempt = 0;
                    attempt < 300;
                    attempt++
                ) {

                    const x =
                        radius +
                        Math.random() *
                        Math.max(
                            1,
                            areaWidth -
                            radius * 2
                        );

                    const y =
                        radius +
                        Math.random() *
                        Math.max(
                            1,
                            areaHeight -
                            radius * 2
                        );


                    const candidate = {
                        x,
                        y,
                        radius
                    };


                    let overlaps =
                        false;


                    for (
                        const other of placed
                    ) {

                        if (
                            circlesOverlap(
                                candidate,
                                other,
                                14
                            )
                        ) {

                            overlaps =
                                true;

                            break;

                        }

                    }


                    if (
                        !overlaps
                    ) {

                        target.style.left =
                            `${x - radius}px`;

                        target.style.top =
                            `${y - radius}px`;

                        placed.push(
                            candidate
                        );

                        placedSuccessfully =
                            true;

                        break;

                    }

                }

            }


            if (
                !placedSuccessfully
            ) {

                const index =
                    placed.length;

                const columns =
                    Math.max(
                        1,
                        Math.floor(
                            areaWidth /
                            (
                                radius * 2 +
                                20
                            )
                        )
                    );

                const column =
                    index %
                    columns;

                const row =
                    Math.floor(
                        index /
                        columns
                    );


                const x =
                    radius +
                    column *
                    (
                        radius * 2 +
                        20
                    );

                const y =
                    radius +
                    row *
                    (
                        radius * 2 +
                        20
                    );


                const safeX =
                    Math.max(
                        0,
                        Math.min(
                            x - radius,
                            areaWidth -
                            radius * 2
                        )
                    );

                const safeY =
                    Math.max(
                        0,
                        Math.min(
                            y - radius,
                            areaHeight -
                            radius * 2
                        )
                    );


                target.style.left =
                    `${safeX}px`;

                target.style.top =
                    `${safeY}px`;


                placed.push({
                    x:
                        safeX +
                        radius,

                    y:
                        safeY +
                        radius,

                    radius
                });

            }

        }
    );

}


/* =====================================================
   CREATE ROUND
===================================================== */

function createRound() {

    playArea.innerHTML = "";

    targets = [];

    const difficulty =
        getDifficulty();

    const targetCount =
        difficulty.count;

    const size =
        difficulty.size;


    for (
        let i = 0;
        i < targetCount;
        i++
    ) {

        const target =
            document.createElement(
                "div"
            );

        target.className =
            "target";

        target.style.width =
            `${size}px`;

        target.style.height =
            `${size}px`;

        target.textContent =
            "TAP";


        if (i === 0) {

            target.classList.add(
                "correct"
            );

            target.classList.add(
                getStreakClass()
            );

        } else {

            target.classList.add(
                "wrong"
            );


            if (
                Math.random() < 0.35
            ) {

                target.classList.add(
                    "deceptive"
                );

            }

        }


        target.addEventListener(
            "pointerdown",
            handleTargetTap
        );


        playArea.appendChild(
            target
        );

        targets.push(
            target
        );

    }


    positionTargetsWithoutOverlap(
        targets
    );

}


/* =====================================================
   TARGET TAP
===================================================== */

function handleTargetTap(event) {

    if (!gameRunning)
        return;

    event.preventDefault();

    const target =
        event.currentTarget;


    if (
        target.classList.contains(
            "tapped"
        )
    ) {

        return;

    }


    if (
        target.classList.contains(
            "correct"
        )
    ) {

        const previousCombo =
            getComboLevel();

        score++;

        streak++;

        const newCombo =
            getComboLevel();

        correctSound();

        vibrate(8);

        updateHUD();


        scorePop.classList.remove(
            "show"
        );

        void scorePop.offsetWidth;

        scorePop.classList.add(
            "show"
        );


        updateCombo(
            newCombo > previousCombo
        );


        checkScoreMilestone();


        const milestones = [
            5,
            10,
            15,
            20,
            25,
            30,
            40,
            50
        ];

        if (
            milestones.includes(
                streak
            )
        ) {

            streakMessage.textContent =
                `${streak} STREAK!`;

            streakMessage.classList.remove(
                "show"
            );

            void streakMessage.offsetWidth;

            streakMessage.classList.add(
                "show"
            );

            streakSound();

            vibrate([
                18,
                25,
                18
            ]);

        }


        target.classList.add(
            "tapped"
        );


        setTimeout(() => {

            if (gameRunning) {

                createRound();

            }

        }, getRoundDelay());

    }


    else {

        streak = 0;

        updateHUD();

        updateCombo();

        wrongSound();

        vibrate([
            70,
            35,
            100
        ]);

        redFlash.classList.remove(
            "show"
        );

        void redFlash.offsetWidth;

        redFlash.classList.add(
            "show"
        );

        endGame();

    }

}


/* =====================================================
   COUNTDOWN
===================================================== */

function startCountdown() {

    return new Promise(
        resolve => {

            let number = 3;

            countdown.classList.remove(
                "hidden"
            );

            countdown.textContent =
                number;

            countdown.classList.remove(
                "pop"
            );

            void countdown.offsetWidth;

            countdown.classList.add(
                "pop"
            );

            countdownSound();

            vibrate(12);


            const interval =
                setInterval(() => {

                    number--;


                    if (
                        number > 0
                    ) {

                        countdown.textContent =
                            number;

                        countdown.classList.remove(
                            "pop"
                        );

                        void countdown.offsetWidth;

                        countdown.classList.add(
                            "pop"
                        );

                        countdownSound();

                        vibrate(12);

                    } else {

                        countdown.textContent =
                            "GO!";

                        countdown.classList.remove(
                            "pop"
                        );

                        void countdown.offsetWidth;

                        countdown.classList.add(
                            "pop"
                        );

                        goSound();

                        vibrate([
                            25,
                            20,
                            35
                        ]);


                        setTimeout(
                            () => {

                                countdown.classList.add(
                                    "hidden"
                                );

                                resolve();

                            },
                            450
                        );


                        clearInterval(
                            interval
                        );

                    }

                }, 800);

        }
    );

}


/* =====================================================
   START GAME
===================================================== */

async function startGame() {

    initAudio();

    clearInterval(timer);

    score = 0;

    streak = 0;

    timeLeft = 30;

    gameRunning = false;

    targets = [];

    playArea.innerHTML = "";

    updateHUD();

    updateCombo();


    milestoneFlash.classList.remove(
        "show",
        "level-2",
        "level-3"
    );

    milestoneLabel.classList.remove(
        "show"
    );


    startScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );


    await startCountdown();


    if (
        gameOverScreen.classList.contains(
            "hidden"
        )
    ) {

        gameRunning = true;

        createRound();

        startTimer();

    }

}


/* =====================================================
   TIMER
===================================================== */

function startTimer() {

    clearInterval(timer);

    timer =
        setInterval(() => {

            if (!gameRunning)
                return;

            timeLeft--;

            updateHUD();


            if (
                timeLeft <= 5 &&
                timeLeft > 0
            ) {

                playTone(
                    420,
                    0.045,
                    "sine",
                    0.018
                );

            }


            if (
                timeLeft <= 0
            ) {

                endGame();

            }

        }, 1000);

}


/* =====================================================
   END GAME
===================================================== */

function endGame() {

    if (!gameRunning)
        return;

    gameRunning = false;

    clearInterval(timer);

    targets = [];

    playArea.innerHTML = "";

    const isNewBest =
        score > highScore;


    if (isNewBest) {

        highScore =
            score;

        localStorage.setItem(
            "oneWrongTapHighScore",
            highScore
        );

    }


    finalScore.textContent =
        score;

    gameOverBest.textContent =
        highScore;

    newBest.style.display =
        isNewBest
            ? "block"
            : "none";


    gameOverScreen.classList.remove(
        "hidden"
    );

    startBest.textContent =
        highScore;

    updateCombo();

}


/* =====================================================
   BUTTONS
===================================================== */

startButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        startGame();

    }
);


playAgainButton.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        startGame();

    }
);


/* =====================================================
   INITIAL BEST SCORE
===================================================== */

startBest.textContent =
    highScore;

gameOverBest.textContent =
    highScore;


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        if (
            targets.length
        ) {

            positionTargetsWithoutOverlap(
                targets
            );

        }

    }
);

   PREVENT UNWANTED MOBILE ACTIONS
===================================================== */

document.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturestart",
    function(event) {

        event.preventDefault();

    }
);


document.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    }
);
